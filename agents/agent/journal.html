<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal des agents</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #222933; --line: #2e3744; --text: #e6e9ee; --muted: #8b95a5;
    --ok: #4cc38a; --warn: #e5b454; --accent: #7aa7ff; --add: #4cc38a; --del: #ef6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 2; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 99px; padding: 3px 10px;
    font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  .chip .n { color: var(--muted); margin-left: 4px; }
  .chip.on .n { color: #1d2b45; }
  .chip .r { margin-left: 4px; color: var(--ok); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; padding: 14px 20px 30px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { main, .chips, header { padding-left: 16px; padding-right: 16px; } }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .commit { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .commit .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .agent { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--panel2); color: var(--accent); white-space: nowrap; }
  .sha { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
  .subject { font-weight: 500; }
  .when { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .stat { font-size: 12px; font-family: ui-monospace, monospace; }
  .add { color: var(--add); } .del { color: var(--del); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
  pre.body { white-space: pre-wrap; font-size: 12px; margin: 6px 0; color: #c9d1dc; }
  table.files { font-size: 12px; font-family: ui-monospace, monospace; border-collapse: collapse; width: 100%; }
  table.files td { padding: 1px 6px 1px 0; }
  table.files td.num { text-align: right; width: 1%; white-space: nowrap; }
  .report { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  .report > summary { padding: 10px 14px; font-size: 14px; color: var(--text); display: flex; gap: 8px; align-items: baseline; list-style: none; }
  .report > summary::-webkit-details-marker { display: none; }
  .report > summary::before { content: '▸'; color: var(--muted); }
  .report[open] > summary::before { content: '▾'; }
  .report .content { padding: 0 16px 12px; border-top: 1px solid var(--line); }
  .try { font-size: 12px; background: var(--accent); color: #0b1220; padding: 1px 9px; border-radius: 6px; font-weight: 600; }
  .try:hover { text-decoration: none; filter: brightness(1.1); }
  .pending { color: var(--muted); font-style: italic; font-size: 12px; }
  .md h1 { font-size: 18px; margin: 14px 0 6px; }
  .md h2 { font-size: 15px; margin: 16px 0 6px; color: var(--accent); text-transform: none; letter-spacing: 0; }
  .md h3 { font-size: 14px; margin: 12px 0 4px; }
  .md p, .md li { color: #d5dae2; }
  .md ul { padding-left: 20px; margin: 4px 0; }
  .md code { background: var(--panel2); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
  .md pre { background: var(--panel2); padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; }
  .md table { border-collapse: collapse; font-size: 12px; margin: 6px 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel2); }
  .empty { color: var(--muted); font-style: italic; }
  .md img { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); margin: 6px 0; display: block; }
  /* The navigation shared by the dashboard pages (hub.html, doc.html). */
  nav.site { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.site a { color: var(--muted); padding: 2px 10px; border-radius: 99px; font-size: 13px; }
  nav.site a:hover { color: var(--text); background: var(--panel2, #222933); text-decoration: none; }
  nav.site a.on { color: #0b1220; background: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Journal des agents</h1>
  <nav class="site"><a href="/">Accueil</a><a href="/agents">Agents</a><a href="/journal">Journal</a><a href="/versions">Versions</a><a href="/roadmap">Backlog</a><a href="/questions">Questions</a><a href="/notifications" title="Notifications sur ton téléphone">🔔</a></nav><script>document.querySelector(`nav.site a[href="${location.pathname}"]`)?.classList.add('on');</script>
  <span class="spacer"></span>
  <span class="muted" id="summary"></span>
</header>
<div class="chips" id="chips"></div>
<main>
  <section><h2>Commits</h2><div id="commits"></div></section>
  <section><h2>Rapports</h2><div id="reports"></div></section>
</main>
<script>
const escapeHtml = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return `il y a ${s} s`;
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  return `il y a ${(s / 3600).toFixed(1)} h`;
}

// A small Markdown renderer: headings, lists, tables, code blocks, inline code, bold, italic and links.
let imageBase = '';
function inline(text) {
  return escapeHtml(text)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) =>
      `<a href="${/^https?:/.test(src) ? src : imageBase + src}" target="_blank"><img src="${/^https?:/.test(src) ? src : imageBase + src}" alt="${alt}" title="${alt}"></a>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>')
    .replace(/(^|[^"])\[([^\]]+)\]\(([^)]+)\)/g, (_, before, label, href) =>
      `${before}<a href="${/^(https?:|#)/.test(href) ? href : imageBase + href}" target="_blank">${label}</a>`);
}

function markdown(source) {
  const lines = source.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith('```')) {
      const code = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) code.push(lines[i++]);
      i++;
      out.push(`<pre>${escapeHtml(code.join('\n'))}</pre>`);
      continue;
    }
    const heading = /^(#{1,4})\s+(.*)$/.exec(line);
    if (heading) {
      const level = Math.min(heading[1].length, 3);
      out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      i++;
      continue;
    }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim());
      const body = rows.filter((row) => !/^\s*\|[\s:|-]+\|\s*$/.test(row));
      const [head, ...rest] = body;
      out.push(`<table><thead><tr>${cells(head).map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rest
        .map((row) => `<tr>${cells(row).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`)
        .join('')}</tbody></table>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        const depth = lines[i].match(/^\s*/)[0].length;
        items.push(`<li style="margin-left:${depth * 8}px">${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ul>${items.join('')}</ul>`);
      continue;
    }
    if (line.trim() === '') {
      i++;
      continue;
    }
    const paragraph = [];
    while (i < lines.length && lines[i].trim() !== '' && !/^(#|```|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) paragraph.push(lines[i++]);
    out.push(`<p>${inline(paragraph.join(' '))}</p>`);
  }
  return out.join('\n');
}

let filter = new URLSearchParams(location.search).get('agent') || '';
let data = { commits: [], reports: [] };
const openReports = new Set();

function setFilter(agent) {
  filter = agent;
  history.replaceState(null, '', agent ? `?agent=${encodeURIComponent(agent)}` : location.pathname);
  render();
}

function render() {
  const { commits, reports } = data;
  const counts = {};
  for (const commit of commits) counts[commit.agent] = (counts[commit.agent] ?? 0) + 1;
  const written = reports.filter((r) => r.text).length;
  document.getElementById('summary').textContent = `${commits.length} commits · ${written}/${reports.length} rapports`;

  document.getElementById('chips').innerHTML = [
    `<button class="chip ${filter ? '' : 'on'}" data-agent="">Tous<span class="n">${commits.length}</span></button>`,
    ...reports.map((r) => `<button class="chip ${filter === r.agent ? 'on' : ''}" data-agent="${escapeHtml(r.agent)}">${escapeHtml(r.agent)}<span class="n">${counts[r.agent] ?? 0}</span>${r.text ? '<span class="r">●</span>' : ''}</button>`),
  ].join('');

  const shown = commits.filter((c) => !filter || c.agent === filter);
  document.getElementById('commits').innerHTML = shown.length
    ? shown.map((c) => {
        const added = c.changes.reduce((sum, f) => sum + f.added, 0);
        const removed = c.changes.reduce((sum, f) => sum + f.removed, 0);
        return `<article class="commit">
          <div class="head"><span class="agent">${escapeHtml(c.agent)}</span><span class="sha">${c.sha}</span>
            <span class="subject">${escapeHtml(c.subject)}</span><span class="when">${ago(c.time)}</span></div>
          <div class="stat">${c.changes.length} fichiers <span class="add">+${added}</span> <span class="del">−${removed}</span></div>
          <details><summary>Détails</summary>
            ${c.body ? `<pre class="body">${escapeHtml(c.body)}</pre>` : ''}
            <table class="files">${c.changes.map((f) => `<tr><td class="num add">+${f.added}</td><td class="num del">−${f.removed}</td><td>${escapeHtml(f.path)}</td></tr>`).join('')}</table>
          </details>
        </article>`;
      }).join('')
    : '<p class="empty">Aucun commit.</p>';

  const shownReports = reports.filter((r) => !filter || r.agent === filter);
  document.getElementById('reports').innerHTML = shownReports
    .map((r) => {
      const isOpen = filter === r.agent || openReports.has(r.agent);
      return `<details class="report" data-agent="${escapeHtml(r.agent)}" ${isOpen ? 'open' : ''}>
        <summary><b>${escapeHtml(r.agent)}</b><a class="try" href="/try/${encodeURIComponent(r.agent)}" target="_blank">▶ Tester cette version</a>${r.text ? `<span class="muted">mis à jour ${ago(r.time)}</span>` : '<span class="pending">pas encore écrit</span>'}</summary>
        <div class="content md">${r.text ? ((imageBase = `/files/${encodeURIComponent(r.agent)}/`), markdown(r.text)) : '<p class="pending">L\'agent écrit son rapport à la fin de son chantier.</p>'}</div>
      </details>`;
    })
    .join('');
}

document.addEventListener('click', (event) => {
  const chip = event.target.closest('.chip');
  if (chip) setFilter(chip.dataset.agent);
});
document.addEventListener('toggle', (event) => {
  const agent = event.target.classList?.contains('report') && event.target.dataset.agent;
  if (!agent) return;
  event.target.open ? openReports.add(agent) : openReports.delete(agent);
}, true);

async function refresh() {
  try {
    const [commits, reports] = await Promise.all([
      fetch('/api/commits', { cache: 'no-store' }).then((r) => r.json()),
      fetch('/api/reports', { cache: 'no-store' }).then((r) => r.json()),
    ]);
    // Skip a redraw when nothing changed, so an open details or a text selection stays put.
    const next = JSON.stringify({ commits, reports });
    if (next === JSON.stringify(data)) return;
    data = { commits, reports };
    render();
  } catch (error) {
    document.getElementById('summary').textContent = `injoignable : ${error.message}`;
  }
}

refresh();
setInterval(refresh, 8000);
</script>
<script src="/nav.js"></script>
</body>
</html>
