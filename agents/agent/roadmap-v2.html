<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlog __PROJECT__</title>
<style>
  :root {
    --bg: #0f1216; --panel: #161b21; --panel2: #1d232b; --panel3: #252d37; --line: #2a323d; --line2: #36404d;
    --text: #e8ebf0; --soft: #b7bfcb; --muted: #7f8a99;
    --todo: #c8b6ff; --queued: #e5b454; --active: #7aa7ff; --merged: #8b95a5; --done: #4cc38a; --bad: #ef6b6b; --auto: #ffb547;
    --accent: #7aa7ff; --r: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---- Top bar ---- */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar1 { display: flex; align-items: center; gap: 14px; padding: 10px 20px 0; }
  .bar1 h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  nav.site { display: flex; gap: 2px; flex-wrap: wrap; }
  nav.site a { color: var(--muted); padding: 2px 9px; border-radius: 99px; font-size: 13px; }
  nav.site a:hover { color: var(--text); background: var(--panel2); }
  nav.site a.on { color: #0b1220; background: var(--accent); font-weight: 600; }
  .proto { font-size: 11px; color: var(--auto); border: 1px solid color-mix(in srgb, var(--auto) 50%, transparent); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
  .bar2 { display: flex; align-items: center; gap: 10px; padding: 10px 20px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-width: 220px; flex: 0 1 320px; }
  .search input { background: none; border: none; outline: none; padding: 7px 0; width: 100%; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { background: none; border: none; padding: 5px 10px; border-radius: 6px; color: var(--soft); cursor: pointer; white-space: nowrap; font-size: 13px; }
  .seg button.on { background: var(--panel3); color: var(--text); font-weight: 600; }
  .seg button .n { color: var(--muted); font-weight: 400; margin-left: 4px; font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--soft); border-radius: 99px; padding: 4px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .chip.on { border-color: var(--todo); color: var(--text); background: color-mix(in srgb, var(--todo) 14%, var(--panel)); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--todo); }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--soft); white-space: nowrap; }
  .icon-btn:hover { border-color: var(--line2); color: var(--text); }
  .stats { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .stats b { color: var(--soft); font-weight: 600; }

  /* ---- Layout ---- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 16px 20px 120px; max-width: 1500px; margin: 0 auto; }
  .layout.board { grid-template-columns: minmax(0, 1fr); }
  /* The board takes the whole width: the agents are its columns, a task's sheet opens as a drawer. */
  .layout.board .side { display: none; }
  body.detail-open .layout.board .side { display: flex; position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); max-height: none; z-index: 40; background: var(--bg); border-left: 1px solid var(--line); padding: 14px; box-shadow: -20px 0 40px rgba(0, 0, 0, .4); }
  .layout.board .side .agents-panel { display: none; }

  /* ---- Groups and cards (list) ---- */
  .group { margin-bottom: 18px; }
  .group-head { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 8px; cursor: pointer; user-select: none; }
  .group-head h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
  .group-head .count { font-size: 12px; color: var(--muted); }
  .group-head .caret { color: var(--muted); width: 12px; transition: transform .15s; }
  .group.closed .caret { transform: rotate(-90deg); }
  .group.closed .cards { display: none; }
  .cards { display: flex; flex-direction: column; gap: 6px; }
  .card { --st: var(--todo); position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 10px 10px; cursor: pointer; transition: border-color .12s, background .12s; }
  .card:hover { border-color: var(--line2); background: var(--panel2); }
  .card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card.picked { border-color: var(--todo); background: color-mix(in srgb, var(--todo) 7%, var(--panel)); }
  .card .box { width: 18px; height: 18px; accent-color: var(--todo); margin: 0; opacity: .35; }
  .card:hover .box, .card.picked .box, body.picking .card .box { opacity: 1; }
  .card .box:disabled { visibility: hidden; }
  .card .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { display: flex; gap: 10px; align-items: center; margin-top: 2px; font-size: 12px; color: var(--muted); flex-wrap: wrap; min-height: 16px; }
  .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--soft); white-space: nowrap; }
  .state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--st); }
  .state.queued { --st: var(--queued); } .state.active { --st: var(--active); } .state.merged { --st: var(--merged); } .state.done { --st: var(--done); } .state.paused { --st: var(--muted); }
  .state.active::before { box-shadow: 0 0 0 0 var(--active); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--active) 70%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
  .agent { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--soft); background: var(--panel3); border-radius: 5px; padding: 0 6px; }
  .fresh-chat { color: #0b1220; background: var(--active); border-radius: 99px; padding: 1px 8px; font-weight: 600; font-size: 11.5px; white-space: nowrap; animation: fresh 2s ease-in-out infinite; }
  .fresh-chat.wait { background: var(--panel3); color: var(--soft); animation: none; }
  @keyframes fresh { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--active) 30%, transparent); } }
  .chat-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 10px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--active); background: color-mix(in srgb, var(--active) 10%, var(--bg)); font-size: 13px; }
  .new-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--todo); display: inline-block; }
  .auto { color: var(--auto); }
  .more { background: none; border: 1px solid transparent; border-radius: 6px; color: var(--muted); padding: 2px 8px; cursor: pointer; font-size: 16px; line-height: 1; }
  .more:hover { border-color: var(--line2); color: var(--text); }
  /* A chain: the parent, then its steps, numbered along a line. */
  .chain { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
  .chain > .card { border: none; border-radius: var(--r) var(--r) 0 0; background: transparent; }
  .chain > .card:hover { background: var(--panel2); }
  .chain .steps { list-style: none; margin: 0; padding: 0 0 6px; }
  .chain .step { display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 12px 6px 10px; cursor: pointer; position: relative; }
  .chain .step:hover { background: var(--panel2); }
  .chain .step.sel { box-shadow: inset 3px 0 0 var(--accent); background: var(--panel2); }
  .chain .step.picked { background: color-mix(in srgb, var(--todo) 7%, var(--panel)); }
  .chain .step .num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line2); color: var(--soft); font-size: 11px; display: grid; place-items: center; background: var(--bg); position: relative; z-index: 1; }
  .chain .step:not(:last-child) .num::after { content: ''; position: absolute; top: 22px; left: 50%; width: 1.5px; height: 20px; background: var(--line2); transform: translateX(-50%); }
  .chain .step .num.queued { border-color: var(--queued); } .chain .step .num.active { border-color: var(--active); color: var(--active); } .chain .step .num.merged, .chain .step .num.done { border-color: var(--done); background: color-mix(in srgb, var(--done) 25%, var(--bg)); color: var(--text); }
  .chain .step .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chain .step .t small { color: var(--muted); margin-left: 8px; }
  .chain .step .box { width: 16px; height: 16px; accent-color: var(--todo); opacity: .35; }
  .chain .step:hover .box, .chain .step.picked .box, body.picking .chain .step .box { opacity: 1; }
  .chain-label { font-size: 12px; color: var(--muted); }
  .chain-bar { display: inline-flex; gap: 2px; vertical-align: middle; }
  .chain-bar i { width: 14px; height: 4px; border-radius: 2px; background: var(--line2); }
  .chain-bar i.queued { background: var(--queued); } .chain-bar i.active { background: var(--active); } .chain-bar i.merged, .chain-bar i.done { background: var(--done); }
  /* A task with an agent: its colour on the left, and a strip that says what the agent is doing. */
  .ag-working { --ag: var(--active); } .ag-review { --ag: var(--auto); } .ag-error { --ag: var(--bad); } .ag-queued { --ag: var(--queued); } .ag-merged { --ag: var(--done); } .ag-idle { --ag: var(--muted); }
  .card.has-agent { border-left: 4px solid var(--ag); padding-left: 8px; background: linear-gradient(90deg, color-mix(in srgb, var(--ag) 9%, var(--panel)) 0%, var(--panel) 55%); }
  .chain.has-agent { border-left: 4px solid var(--ag); }
  .chain.has-agent > .card.has-agent { border-left: none; }
  .strip { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: color-mix(in srgb, var(--ag) 10%, var(--bg)); border: 1px solid color-mix(in srgb, var(--ag) 35%, transparent); min-width: 0; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--ag); white-space: nowrap; }
  .badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ag); flex: none; }
  .ag-working .badge::before { animation: pulse-ag 1.4s infinite; }
  @keyframes pulse-ag { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ag) 75%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  .strip .doing { flex: 1 1 160px; min-width: 0; font-size: 12px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip .facts { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .strip .acts { display: flex; gap: 4px; margin-left: auto; }
  .mini.interim { border-color: var(--auto); color: var(--auto); }
  .mini.accept { border-color: var(--done); color: var(--done); font-weight: 600; }
  .empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }

  /* ---- Board ---- */
  .board-cols { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; }
  .col { background: color-mix(in srgb, var(--panel) 55%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; min-height: 120px; }
  .col h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); display: flex; gap: 8px; align-items: center; }
  .col h3 .state { text-transform: none; letter-spacing: 0; }
  .col .cards .card { grid-template-columns: 20px minmax(0, 1fr); }
  .col .card .title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .col .card .more { display: none; }
  .col .strip .doing { flex-basis: 100%; }
  .col.drop-ok { outline: 2px dashed var(--ag); outline-offset: 2px; }

  /* ---- Side: detail, or agents ---- */
  .side { position: sticky; top: 112px; align-self: start; max-height: calc(100vh - 130px); overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .n { color: var(--muted); font-weight: 400; }
  .run { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .run:first-of-type { border-top: none; }
  .run .name { font-family: ui-monospace, monospace; font-size: 12.5px; font-weight: 600; }
  .run .what { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .acts { display: flex; gap: 4px; }
  .mini { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; color: var(--soft); white-space: nowrap; }
  .mini:hover { border-color: var(--line2); color: var(--text); }
  .mini.go { border-color: color-mix(in srgb, var(--done) 60%, transparent); color: var(--done); }
  .mini.stop { color: var(--bad); }
  .corner { margin-top: 6px; }
  .mini-agent { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 4px 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
  .mini-agent .badge { margin-top: 5px; }
  .mini-agent .who { min-width: 0; font-size: 12.5px; }
  .mini-agent .who b { font-family: ui-monospace, monospace; }
  .mini-agent .who small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-agent .who .for { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-agent .acts { grid-column: 2; display: flex; gap: 4px; flex-wrap: wrap; }
  .corner summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; }
  .corner summary::-webkit-details-marker { display: none; }
  .corner[open] summary { color: var(--soft); }
  .corner .run { opacity: .75; }
  .detail h3 { margin: 0 0 4px; font-size: 17px; line-height: 1.3; }
  .detail .where { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .detail .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .think-box { margin: 10px 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
  .detail .text { font-size: 13px; color: var(--soft); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 46vh; overflow: auto; }
  .detail .text h4 { margin: 10px 0 4px; font-size: 13px; color: var(--text); }
  .detail .text p { margin: 6px 0; } .detail .text ul { margin: 4px 0; padding-left: 18px; }
  .detail .text code { background: var(--panel2); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .detail .close { float: right; }
  .detail .back { display: none; }
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  .btn.pick { border-color: var(--todo); color: var(--todo); }
  .btn.pick.on { background: var(--todo); color: #1a1030; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---- Menu ---- */
  .menu { position: fixed; z-index: 50; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 4px; min-width: 230px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  .menu button { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  .menu button:hover { background: var(--panel3); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu select { width: 100%; margin: 4px 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }

  /* ---- Selection bar ---- */
  .pickbar { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 140%); transition: transform .2s; z-index: 30; width: min(980px, calc(100% - 24px));
    background: var(--panel2); border: 1px solid var(--todo); border-radius: 14px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); }
  .pickbar.show { transform: translate(-50%, 0); }
  .pickbar .main { display: flex; gap: 10px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
  .pickbar .count { font-weight: 700; color: var(--todo); white-space: nowrap; }
  .pickbar select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
  .pickbar label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .pickbar .review { max-height: 45vh; overflow: auto; border-top: 1px solid var(--line); padding: 10px 14px; display: none; }
  .pickbar.open .review { display: block; }
  .pick { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
  .pick .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .pick .head b { color: var(--text); font-size: 13px; flex-basis: 100%; }
  .pick input { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; font-family: ui-monospace, monospace; font-size: 12px; width: 170px; }
  .pick-think { flex-basis: 100%; margin-top: 4px; }
  .pickbar #p-think .tk-label { width: auto; }
  .pickbar #p-think .tk-picker { flex-direction: row; flex-wrap: wrap; gap: 4px 12px; }
  .pick select { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; font-size: 12px; }
  .pick textarea { width: 100%; min-height: 120px; margin-top: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11px/1.35 ui-monospace, monospace; padding: 6px; resize: vertical; }
  .pick .note { color: var(--todo); font-size: 11.5px; flex-basis: 100%; }
  .ghost { position: fixed; z-index: 70; pointer-events: none; background: var(--panel3); border: 1px solid var(--accent); border-radius: 10px; padding: 8px 12px; max-width: 320px; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); font-weight: 600; transform: translate(-50%, -120%) rotate(-1.5deg); }
  .ghost small { display: block; font-weight: 400; color: var(--accent); margin-top: 2px; }
  .ghost.no small { color: var(--muted); }
  .dragging-src { opacity: .35; }
  .drop-on { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: var(--r); }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  [data-drag] { touch-action: pan-y; }
  .toast { position: fixed; right: 16px; bottom: 16px; z-index: 60; background: var(--panel3); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; max-width: 420px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
  .toast.bad { border-color: var(--bad); }

  /* ---- Phone ---- */
  .tabs-phone { display: none; }
  @media (max-width: 980px) {
    .layout, .layout.board { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 120px; }
    .side { position: static; max-height: none; }
    .bar1, .bar2 { padding-left: 16px; padding-right: 16px; }
    .board-cols { grid-template-columns: repeat(5, minmax(240px, 80vw)); }
    body.detail-open .side { position: fixed; inset: 0; z-index: 40; background: var(--bg); padding: 12px 16px 100px; max-height: none; overflow: auto; }
    body.detail-open .side .agents-panel { display: none !important; }
    .detail .back { display: inline-flex !important; margin-bottom: 10px; }
    .detail .close { display: none; }
    .tabs-phone { display: inline-flex; }
    body:not(.tab-agents) .side .agents-panel { display: none; }
    body.tab-agents main { display: none; }
  }
  @media (max-width: 600px) {
    nav.site { display: none; }
    #filter { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    #filter::-webkit-scrollbar { display: none; }
    .bar2 { overflow: hidden; }
    .search { flex: 1 1 100%; min-width: 0; }
    .stats { display: none; }
    .card { grid-template-columns: 22px minmax(0, 1fr) auto; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="bar1">
    <h1>Backlog</h1>
    <nav class="site"><a href="/">Accueil</a><a href="/agents">Agents</a><a href="/journal">Journal</a><a href="/versions">Versions</a><a href="/roadmap" class="on">Backlog</a><a href="/questions">Questions</a><a href="/notifications" title="Notifications">🔔</a></nav>
    <span class="spacer"></span>

  </div>

    <label class="search"><span class="muted">⌕</span><input id="q" type="search" placeholder="Chercher un chantier, un agent…  ( / )" autocomplete="off"></label>

      <button data-f="todo">À faire<span class="n" id="n-todo"></span></button>
      <button data-f="active">En cours<span class="n" id="n-active"></span></button>

<div class="layout" id="layout">
  <main id="main"></main>
  <aside class="side" id="side"></aside>
</div>

<div class="pickbar" id="pickbar">
  <div class="main">
    <span class="count" id="pick-count"></span>
    <div id="p-think" title="Par défaut pour chaque tâche choisie : combien l'agent réfléchit (claude --effort) et son modèle"></div>
    <button class="btn" id="p-review">Revoir les prompts ▴</button>
    <span class="spacer"></span>
    <button class="btn" id="p-clear">Vider</button>
    <button class="btn" id="p-queue">Mettre en file</button>

  </div>

</div>

<script src="/think.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
const STATE = { todo: 'à faire', queued: 'en file', active: 'en cours', merged: 'fusionné', done: 'livré', paused: 'en pause' };

let data = null;
let filter = store.get('v2.filter', 'todo');
let view = store.get('v2.view', 'list');
let onlyNew = false;
let query = '';
let selected = null;        // the task shown in the detail panel
const closed = new Set(store.get('v2.closed', []));
const picked = new Map();   // id -> { name, base, effort, model, prompt, edited }
const defaults = store.get('roadmap.defaults', {});

// ---------------------------------------------------------------- data
let agentsData = { agents: [] };
async function load() {
  const [roadmap, agents] = await Promise.all([fetch('/api/roadmap', { cache: 'no-store' }).then((r) => r.json()), fetch('/api/agents', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ agents: [] }))]);
  data = roadmap;
  agentsData = agents;
  for (const id of [...picked.keys()]) if (!byId(id) || byId(id).state !== 'todo') picked.delete(id);
  render();
}
const byId = (id) => data.items.find((item) => item.id === id);
const tasks = () => data.items.filter((item) => item.kind === 'task');
const isNew = (item) => data.pending.added.includes(item.id) || data.pending.modified.includes(item.id);
const children = (id) => tasks().filter((item) => item.after === id);
function chainOf(id) {
  const out = [];
  const walk = (parent) => { for (const child of children(parent)) { out.push(child); walk(child.id); } };
  walk(id);
  return out;
}
// ---------------------------------------------------------------- agents: what each one is doing
// working: its process runs (or it moved in the last minutes); review: it is over, its work waits for « Accepter »;
// error; queued; merged: accepted; idle: neither (stopped, calm).
const AGENT = {
  queued: { label: 'en file', icon: '⏳' },
  working: { label: 'au travail', icon: '⚙' },
  review: { label: 'fini · à accepter', icon: '✋' },
  error: { label: 'en erreur', icon: '⚠' },
  merged: { label: 'acceptée', icon: '✓' },
  idle: { label: 'en pause', icon: '⏸' },
};
function agentInfo(name) {
  if (!name) return null;
  const agent = agentsData.agents?.find((one) => one.AGENT_NAME === name);
  const entry = (data.queue ?? []).find((one) => one.name === name);
  if (!agent && !entry) return { name, status: 'idle', label: AGENT.idle.label };
  const run = agent?.run ?? entry?.run;
  const events = agent?.progress?.events ?? [];
  const last = (kind) => [...events].reverse().find((event) => event.kind === kind);
  const recent = agent?.activity && Date.now() - agent.activity < 10 * 60_000;
  const status = entry?.status === 'queued' ? 'queued'
    : agent?.AGENT_ARCHIVED ? 'merged'
    : run?.state === 'running' ? 'working'
    : run?.state === 'error' || run?.state === 'lost' ? 'error'
    : run?.state === 'done' || (agent?.report && !agent?.dirty?.length) ? 'review'
    : recent ? 'working' : 'idle';
  const doing = status === 'working' ? (last('tool')?.text ?? last('say')?.text ?? '').replace(/^[A-Za-z]+ · /, '').split('\n')[0]
    : status === 'review' ? (last('say')?.text ?? 'rapport remis').split('\n')[0]
    : status === 'error' ? (run?.state === 'lost' ? 'processus disparu' : `code ${run?.code}`) : '';
  return {
    name, status, label: AGENT[status].label, doing,
    since: run?.startedAt ?? null,
    commits: agent?.commits?.length ?? 0,
    behind: agent?.deliverables?.behind ?? 0,
    deliverables: agent?.deliverables ?? null,
    serving: Boolean(agent?.server && agent?.client),
    report: Boolean(agent?.report),
    reportInterim: Boolean(agent?.reportInterim),
    port: agent?.CLIENT_PORT ?? null,
    exists: Boolean(agent),
    effort: agent?.settings?.effort ?? entry?.effort ?? null,
    model: agent?.settings?.model ?? entry?.model ?? null,
  };
}
// The agent of a task: the last one named on its status line (the one at work).
const agentOf = (item) => agentInfo(item.agents?.at?.(-1) ?? item.agent?.split(/,\s*/).at(-1));

function matches(item) {
  if (onlyNew && !isNew(item)) return false;
  if (query) {
    const hay = `${item.title} ${item.agent ?? ''} ${item.section} ${item.text}`.toLowerCase();
    if (!query.split(/\s+/).every((word) => hay.includes(word))) return false;
  }
  if (filter === 'all') return true;
  if (filter === 'active') return item.state === 'queued' || item.state === 'active';
  return item.state === filter;
}

// ---------------------------------------------------------------- pieces
const stateTag = (item) => (item.state === 'todo' ? '' : `<span class="state ${item.state}">${STATE[item.state] ?? item.state}</span>`);
function meta(item, stripped = false) {
  const info = item.agent && !stripped && item.state !== 'done' ? agentOf(item) : null;
  // The agent's state says more than the task's: « acceptée » rather than « fusionné » and « acceptée ».
  const parts = [stripped || (info && info.status !== 'idle') ? '' : stateTag(item)];
  if (item.agent && !stripped) {
    parts.push(info && info.status !== 'idle' ? `<span class="badge ag-${info.status}" title="${esc(info.name)} : ${esc(info.label)}">${esc(info.label)}</span><span class="agent">${esc(info.name)}</span>` : `<span class="agent">${esc(item.agent)}</span>`);
  }
  if (item.auto) parts.push(`<span class="auto" title="Lancée d'elle-même à la fusion de sa mère">⚡ auto</span>${item.auto.effort || item.auto.model ? Think.badge(item.auto, { small: true }) : ''}`);
  // A chat with Claude: thinking (…), or an answer not seen yet, which stands out with what it proposes.
  const chatTag = (chat, icon, mode) => {
    if (!chat) return '';
    if (chat.pending) return `<span class="fresh-chat wait" title="Claude réfléchit">${icon} Claude réfléchit…</span>`;
    const u = chat.unseen ?? {};
    if (u.answers) return `<a class="fresh-chat" href="/roadmap/v1?open=${esc(item.id)}&mode=${mode}" title="Une réponse de Claude que tu n'as pas encore vue">${icon} ${u.error ? 'erreur, à renvoyer' : u.subtasks ? `${u.subtasks} sous-tâche${u.subtasks > 1 ? 's' : ''} proposée${u.subtasks > 1 ? 's' : ''}` : u.proposals ? 'nouvelle version proposée' : 'nouvelle réponse'}</a>`;
    return `<span title="Discussion">${icon} ${chat.count}</span>`;
  };
  parts.push(chatTag(item.chat, '💬', 'chat'), chatTag(item.subChat, '🧩', 'subtasks'));
  if (isNew(item)) parts.push('<span class="new-dot" title="Nouveau ou modifié depuis le rafraîchissement"></span>');
  return parts.filter(Boolean).join('');
}
const box = (item) => `<input type="checkbox" class="box" data-pick="${esc(item.id)}" ${picked.has(item.id) ? 'checked' : ''} ${item.state !== 'todo' ? 'disabled' : ''} title="Choisir pour la mettre en file" aria-label="Choisir ${esc(item.title)}">`;
function shortcuts(info) {
  const name = esc(info.name);
  const report = info.report ? `<a class="mini${info.reportInterim ? ' interim' : ''}" href="/agents#${name}:rapport" title="${info.reportInterim ? 'Son rapport intermédiaire : où il en est' : 'Son rapport'}">${info.reportInterim ? '🚧' : '📝'} Rapport</a>` : '';
  const out = `${report}<a class="mini" href="/run/${name}" target="_blank" title="Ce que fait l'agent">Sortie</a>`;
  if (info.status === 'queued') return `<button class="mini go" data-q="launch" data-name="${name}">▶ Lancer</button>`;
  if (info.status === 'merged') return report;
  if (info.status === 'working') return `${out}<button class="mini stop" data-q="stop" data-name="${name}" title="Arrêter">■</button>`;
  if (info.status === 'review') return `${info.serving ? `<a class="mini" href="http://localhost:${esc(info.port)}" target="_blank">Ouvrir</a>` : `<button class="mini" data-a="try" data-name="${name}" title="Lancer son jeu pour l'essayer">▶ Tester</button>`}${out}<button class="mini accept" data-a="accept" data-name="${name}" title="Fusionner sa branche : la tâche passe dans « À publier »">✓ Accepter</button>`;
  if (info.status === 'error') return `${out}<button class="mini go" data-q="resume" data-name="${name}" title="Reprendre la même session">↻ Relancer</button>`;
  return out;
}
function strip(info) {
  if (!info) return '';
  const facts = [info.commits ? `${info.commits} commit${info.commits > 1 ? 's' : ''}` : '', info.status === 'working' && info.since ? ago(info.since) : '', info.behind > 0 && info.status === 'review' ? `${info.behind} en retard` : ''].filter(Boolean).join(' · ');
  return `<div class="strip"><span class="badge">${esc(info.label)}</span><span class="agent">${esc(info.name)}</span>${Think.badge({ effort: info.effort, model: info.model }, { small: true, fallback: PROJECT.defaults.effort })}<span class="doing" title="${esc(info.doing)}">${esc(info.doing)}</span>${facts ? `<span class="facts">${facts}</span>` : ''}<span class="acts">${shortcuts(info)}</span></div>`;
}
const LIVE = new Set(['queued', 'working', 'review', 'error']);
function card(item, { chain = null } = {}) {
  const found = item.state !== 'todo' && item.state !== 'done' ? agentOf(item) : null;
  const info = found && LIVE.has(found.status) ? found : null;
  // Out of its chain (the board), a sub-task says where it stands: « ↳ 3/6 de Grandir… ».
  let place = '';
  if (!chain && item.after && view === 'board') {
    let root = item;
    while (root.after && byId(root.after)) root = byId(root.after);
    const all = [root, ...chainOf(root.id)];
    place = `<span title="Sous-tâche de « ${esc(root.title)} »">↳ ${all.indexOf(item) + 1}/${all.length}</span>`;
  }
  const steps = chain?.length ? `<span class="chain-label">chaîne de ${chain.length + 1} <span class="chain-bar">${[item, ...chain].map((one) => `<i class="${one.state}"></i>`).join('')}</span></span>` : '';
  return `<div class="card${selected === item.id ? ' sel' : ''}${picked.has(item.id) ? ' picked' : ''}${info ? ` has-agent ag-${info.status}` : ''}" data-open="${esc(item.id)}" data-drag="${esc(item.id)}">
    ${box(item)}
    <div style="min-width:0"><div class="title" title="${esc(item.title)}">${esc(item.title)}</div><div class="meta">${place}${steps}${meta(item, Boolean(info))}</div></div>
    <button class="more" data-menu="${esc(item.id)}" title="Actions" aria-label="Actions">⋯</button>${strip(info)}</div>`;
}
function chainBlock(root, steps) {
  const found = root.state !== 'todo' && root.state !== 'done' ? agentOf(root) : null;
  const info = found && LIVE.has(found.status) ? found : null;
  return `<div class="chain${info ? ` has-agent ag-${info.status}` : ''}">${card(root, { chain: steps })}<ol class="steps">${steps.map((step, index) => `
    <li class="step${selected === step.id ? ' sel' : ''}${picked.has(step.id) ? ' picked' : ''}" data-open="${esc(step.id)}" data-drag="${esc(step.id)}">
      ${box(step)}<span class="num ${step.state}">${index + 2}</span>
      <span class="t">${esc(step.title)}${step.after !== (index ? steps[index - 1].id : root.id) ? `<small>après « ${esc(byId(step.after)?.title ?? '')} »</small>` : ''}</span>
      <span class="meta" style="margin:0">${meta(step)}<button class="more" data-menu="${esc(step.id)}" aria-label="Actions">⋯</button></span></li>`).join('')}</ol></div>`;
}

// ---------------------------------------------------------------- views
function listView() {
  const groups = [];
  for (const item of data.items) {
    if (item.kind === 'section') groups.push({ head: item, items: [] });
    else groups.at(-1)?.items.push(item);
  }
  const html = groups.map(({ head, items }) => {
    // Roots (not sub-tasks of a task of the same group), each with its chain.
    const roots = items.filter((item) => !item.after || !items.some((one) => one.id === item.after));
    const blocks = roots.map((root) => {
      const steps = chainOf(root.id).filter((step) => items.includes(step));
      const shown = [root, ...steps].some(matches);
      if (!shown) return '';
      return steps.length ? chainBlock(root, steps) : card(root);
    }).filter(Boolean);
    if (!blocks.length) return '';
    const n = (state) => items.filter((item) => item.state === state).length;
    const count = [n('todo') && `${n('todo')} à faire`, (n('queued') + n('active')) && `${n('queued') + n('active')} en cours`, n('merged') && `${n('merged')} fusionné${n('merged') > 1 ? 's' : ''}`].filter(Boolean).join(' · ');
    return `<section class="group${closed.has(head.id) ? ' closed' : ''}"><div class="group-head" data-group="${esc(head.id)}" data-drop-group="${esc(head.id)}"><span class="caret">▾</span><h2>${esc(head.title)}</h2><span class="count">${count}</span></div>
      <div class="cards">${blocks.join('')}</div></section>`;
  }).join('');
  return html || `<div class="empty">Aucun chantier ${query ? `pour « ${esc(query)} »` : 'avec ce filtre'}.</div>`;
}
// The board follows the agents: a task with an agent stands where its agent is.
const COLUMNS = [['todo', 'À faire', 'todo'], ['queued', 'En file', 'queued'], ['working', 'Au travail', 'working'], ['review', 'À accepter', 'review'], ['merged', 'Acceptées', 'merged']];
function columnOf(item) {
  if (item.state === 'todo' || item.state === 'paused') return 'todo';
  if (item.state === 'done') return null;
  const info = agentOf(item);
  if (item.state === 'merged' || info?.status === 'merged') return 'merged';
  if (item.state === 'queued' || info?.status === 'queued') return 'queued';
  if (info?.status === 'working') return 'working';
  return 'review';
}
function boardView() {
  const shown = tasks().filter((item) => (!onlyNew || isNew(item)) && matchesQuery(item));
  const done = shown.filter((item) => item.state === 'done').length;
  return `<div class="board-cols">${COLUMNS.map(([column, label, tone]) => {
    const cardsIn = shown.filter((item) => columnOf(item) === column);
    return `<div class="col ag-${tone}" data-col="${column}"><h3><span class="badge">${label}</span><span class="muted">${cardsIn.length}</span></h3><div class="cards">${cardsIn.map((item) => card(item)).join('') || '<span class="muted" style="font-size:12px">—</span>'}</div></div>`;
  }).join('')}</div><p class="muted" style="font-size:12px;margin-top:10px">Glisse une carte : d'« À faire » vers « En file » pour la mettre en file, vers « Au travail » pour la lancer ; d'« À accepter » vers « Acceptées » pour l'accepter. ${done} livrés, dans le filtre Livrés de la Liste.</p>`;
}
function matchesQuery(item) {
  if (!query) return true;
  const hay = `${item.title} ${item.agent ?? ''} ${item.section} ${item.text}`.toLowerCase();
  return query.split(/\s+/).every((word) => hay.includes(word));
}

// ---------------------------------------------------------------- side: agents, or a task's detail
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  return s < 60 ? 'à l’instant' : s < 3600 ? `${Math.round(s / 60)} min` : s < 86400 ? `${(s / 3600).toFixed(1)} h` : `${Math.round(s / 86400)} j`;
}
// A summary of the agents, with their shortcuts; everything else on the Agents page.
function agentsPanel() {
  const names = [...new Set([...(agentsData.agents ?? []).filter((one) => !one.AGENT_ARCHIVED && one.AGENT_KIND !== 'release').map((one) => one.AGENT_NAME), ...(data.queue ?? []).map((one) => one.name)])];
  const infos = names.map(agentInfo).filter(Boolean);
  const by = (status) => infos.filter((info) => info.status === status);
  const live = [...by('error'), ...by('review'), ...by('working'), ...by('queued')];
  const rest = infos.filter((info) => !live.includes(info));
  const task = (name) => tasks().find((item) => item.agents?.includes?.(name) || item.agent?.split(/,\s*/).includes(name));
  const row = (info) => `<div class="mini-agent ag-${info.status}"><span class="badge"></span><span class="who"><b>${esc(info.name)}</b> ${Think.badge({ effort: info.effort, model: info.model }, { small: true, fallback: PROJECT.defaults.effort })}<small>${esc(info.label)}${info.doing ? ` · ${esc(info.doing)}` : ''}</small>${task(info.name) ? `<a href="#" data-open="${esc(task(info.name).id)}" class="for">${esc(task(info.name).title)}</a>` : ''}</span><span class="acts">${shortcuts(info)}</span></div>`;
  const counts = ['working', 'review', 'error', 'queued'].filter((status) => by(status).length).map((status) => `<span class="badge ag-${status}">${by(status).length} ${AGENT[status].label}</span>`).join('');
  return `<div class="panel agents-panel"><h2>Agents <span class="spacer"></span><a href="/agents" style="text-transform:none;letter-spacing:0;font-weight:600">Page Agents →</a></h2>
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">${counts || '<span class="muted" style="font-size:13px">Aucun agent au travail.</span>'}</div>
    ${live.map(row).join('')}
    ${by('queued').length > 1 ? `<button class="mini go" data-q="launch-all" style="margin-top:6px">▶ Lancer les ${by('queued').length} en file</button>` : ''}
    ${rest.length ? `<details class="corner"${store.get('v2.corner', false) ? ' open' : ''}><summary>${rest.length} autre${rest.length > 1 ? 's' : ''} (en pause, acceptées) ▸</summary>${rest.map(row).join('')}</details>` : ''}</div>`;
}
function md(text) {
  const lines = String(text).split('\n').slice(1);
  let html = '', list = false;
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
  for (const line of lines) {
    if (/^\s*[-*]\s+/.test(line)) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(line.replace(/^\s*[-*]\s+/, ''))}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (/^####\s+/.test(line)) html += `<h4>${inline(line.replace(/^####\s+/, ''))}</h4>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}
function detailPanel(item) {
  const parent = item.after && byId(item.after);
  const steps = chainOf(item.id);
  const info = item.agent ? agentOf(item) : null;
  const d = info?.deliverables;
  const check = (ok, label) => `<span style="color:${ok ? 'var(--done)' : 'var(--muted)'}">${ok ? '✓' : '○'} ${label}</span>`;
  const agentBox = info ? `<div class="ag-${info.status}" style="margin:10px 0"><div class="strip" style="margin:0">${strip(info).replace(/^<div class="strip">|<\/div>$/g, '')}</div>
      ${d ? `<div class="row" style="font-size:12px;gap:12px">${check(d.commits > 0, `${d.commits} commit${d.commits > 1 ? 's' : ''}`)}${check(d.report, 'rapport')}${check(d.entry, 'entrée')}${check(d.captures > 0, `${d.captures} capture${d.captures > 1 ? 's' : ''}`)}${check(!(d.behind > 0), d.behind > 0 ? `${d.behind} commits de ${esc(d.base)} à fusionner` : `à jour avec ${esc(d.base)}`)}</div>` : ''}
      <div class="row" style="font-size:12px"><a href="/agents">Sa carte sur la page Agents →</a>${d?.report ? ` · <a href="/agents" title="Rapport sur sa carte">rapport</a>` : ''}</div></div>` : '';
  return `<div class="panel detail"><button class="btn back" data-close>← Retour aux chantiers</button><button class="mini close" data-close title="Fermer (Échap)">✕</button>
    <h3>${esc(item.title)}</h3>
    <div class="where">${esc(item.section)} · ligne ${item.line}${parent ? ` · ↳ après « <a href="#" data-open="${esc(parent.id)}">${esc(parent.title)}</a> »` : ''}</div>
    <div class="row">${stateTag(item) || '<span class="state todo">à faire</span>'}${item.auto ? '<span class="auto">⚡ auto</span>' : ''}</div>

  }
  const autoSet = event.target.closest('[data-auto-set]');
  if (autoSet) {
    const id = autoSet.dataset.id;
    const body = { auto: true, ...Object.fromEntries([...document.querySelectorAll(`[data-auto-set][data-id="${CSS.escape(id)}"]`)].map((one) => [one.dataset.autoSet, one.value || null])) };
    return post(`/api/backlog/auto/${id}`, body);
  }
  const box = event.target.closest('[data-pick]');
  if (box) togglePick(box.dataset.pick, box.checked);
});
document.addEventListener('toggle', (event) => {
  if (event.target.classList?.contains('corner')) store.set('v2.corner', event.target.open);
}, true);
$('filter').addEventListener('click', (event) => {
  const button = event.target.closest('[data-f]');
  if (!button) return;
  filter = button.dataset.f;
  store.set('v2.filter', filter);
  render();
});
$('view').addEventListener('click', (event) => {
  const button = event.target.closest('[data-v]');
  if (!button) return;
  view = button.dataset.v;
  store.set('v2.view', view);
  render();
});
$('phone-tabs').addEventListener('click', (event) => {
  const button = event.target.closest('[data-tab]');
  if (!button) return;
  document.body.classList.toggle('tab-agents', button.dataset.tab === 'agents');
  for (const one of document.querySelectorAll('#phone-tabs button')) one.classList.toggle('on', one === button);
});
$('news').addEventListener('click', () => (onlyNew = !onlyNew, render()));
$('q').addEventListener('input', (event) => (query = event.target.value.trim().toLowerCase(), render()));
$('refresh').addEventListener('click', async () => {
  data = await (await fetch('/api/roadmap/refresh', { method: 'POST' })).json();
  onlyNew = false;
  render();
  toast('Backlog relu : les « nouveaux » repartent de zéro.');
});
document.addEventListener('keydown', (event) => {
  if (event.key === '/' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') { event.preventDefault(); $('q').focus(); }
  if (event.key === 'Escape') { if (menu) closeMenu(); else if (selected) (selected = null, render()); }
});

// /roadmap?refresh=1 (the Agents page), /roadmap#t-<id> (a notification): refresh, or open that task.
(async () => {
  const params = new URLSearchParams(location.search);
  if (params.has('refresh')) {
    history.replaceState(null, '', '/roadmap');
    data = await (await fetch('/api/roadmap/refresh', { method: 'POST' })).json();
  }
  await load();
  const hash = decodeURIComponent(location.hash.replace(/^#t-/, ''));
  if (hash && byId(hash)) (selected = hash, render());
})();
setInterval(() => { if (!menu && !drag.id && document.visibilityState === 'visible' && !document.activeElement?.closest?.('.pickbar')) load(); }, 5000);
</script>
<script src="/nav.js"></script>
</body>
</html>
