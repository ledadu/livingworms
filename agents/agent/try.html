<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tester __AGENT__</title>
<style>
  :root { --bg: #111418; --panel: #1a1f26; --line: #2e3744; --text: #e6e9ee; --muted: #8b95a5; --accent: #7aa7ff; --bad: #ef6b6b; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; max-width: 560px; margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 6px 0; }
  a { color: var(--accent); }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--bad); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; margin-right: 8px; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <h1>Version de l'agent « __AGENT__ »</h1>
  <p id="state"><span class="spin"></span>Démarrage de son serveur et de son client… (quelques secondes, jusqu'à quelques minutes quand la machine est chargée)</p>
  <p>Compte de test : <b>banc</b> / <b>banc-essai-1</b> (copie de la base de dev, propre à cet agent).</p>
  <p><a href="/">Accueil</a> · <a href="/agents">Agents</a> · <a href="/journal?agent=__AGENT__">Commits et rapport</a></p>
  <pre id="error"></pre>
</div>
<script>
// Retries while the dashboard itself is unreachable (restarting), gives up on a real failure to start.
async function start(attempt = 0) {
  let result;
  try {
    result = await (await fetch('/api/up/__AGENT__', { method: 'POST' })).json();
  } catch (error) {
    if (attempt < 20) return setTimeout(() => start(attempt + 1), 3000);
    result = { ok: false, error: error.message };
  }
  if (!result.ok) {
    document.getElementById('state').textContent = 'Échec du démarrage.';
    document.getElementById('error').textContent = result.error;
    return;
  }
  // The game on the machine this page was opened from (its Tailscale name from a phone).
  const url = `http://${location.hostname}:${new URL(result.url).port}`;
  document.getElementById('state').textContent = `Prêt : ouverture de ${url}…`;
  location.replace(url);
}
start();
</script>
</body>
</html>
