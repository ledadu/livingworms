<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents __PROJECT__</title>
<style>
  :root {
    --bg: #0f1216; --panel: #161b21; --panel2: #1d232b; --panel3: #252d37; --line: #2a323d; --line2: #36404d;
    --text: #e8ebf0; --soft: #b7bfcb; --muted: #7f8a99;
    --todo: #c8b6ff; --queued: #e5b454; --active: #7aa7ff; --done: #4cc38a; --bad: #ef6b6b; --auto: #ffb547; --ask: #ff8ad8;
    --accent: #7aa7ff; --r: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  code, .mono { font-family: ui-monospace, monospace; }

  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar1 { display: flex; align-items: center; gap: 14px; padding: 10px 20px 0; }
  .bar1 h1 { font-size: 17px; margin: 0; }
  nav.site { display: flex; gap: 2px; flex-wrap: wrap; }
  nav.site a { color: var(--muted); padding: 2px 9px; border-radius: 99px; font-size: 13px; }
  nav.site a:hover { color: var(--text); background: var(--panel2); }
  nav.site a.on { color: #0b1220; background: var(--accent); font-weight: 600; }
  .old { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
  .bar2 { display: flex; align-items: center; gap: 8px; padding: 10px 20px; flex-wrap: wrap; }
  .chip { --c: var(--muted); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--soft); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip.plain::before { display: none; }
  .chip b { color: var(--text); }
  .chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); color: var(--text); }
  .chip.zero { opacity: .45; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); cursor: pointer; white-space: nowrap; }
  .switch input { accent-color: var(--auto); width: 16px; height: 16px; margin: 0; }
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; color: var(--text); display: inline-flex; gap: 6px; align-items: center; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  .btn.ok { background: var(--done); border-color: var(--done); color: #08130d; font-weight: 600; }
  .btn.warn { border-color: var(--auto); color: var(--auto); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .wrap { max-width: 1500px; margin: 0 auto; padding: 16px 20px 120px; display: flex; flex-direction: column; gap: 18px; }
  h2.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
  h2.sec .n { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* « Ce qui t'attend » : one line per thing that needs you. */
  .inbox { display: flex; flex-direction: column; gap: 6px; }
  .todo-line { --c: var(--auto); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--c) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); border-left: 4px solid var(--c); border-radius: 10px; padding: 8px 12px; }
  .todo-line .what { flex: 1 1 260px; min-width: 0; }
  .todo-line .what b { font-family: ui-monospace, monospace; }
  .todo-line .what small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calm { color: var(--muted); font-size: 13px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; }

  /* Agent cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .ag { --c: var(--muted); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 9%, var(--panel)) 0, var(--panel) 90px); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; cursor: pointer; transition: border-color .12s; min-width: 0; }
  .ag:hover { border-color: var(--line2); border-top-color: var(--c); }
  .ag.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .s-working { --c: var(--active); } .s-review { --c: var(--auto); } .s-error { --c: var(--bad); } .s-queued { --c: var(--queued); } .s-idle { --c: var(--muted); } .s-merged { --c: var(--done); } .s-ask { --c: var(--ask); }
  .ag .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; }
  .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .s-working .status::before { animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 75%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
  .ag .name { font-family: ui-monospace, monospace; font-size: 13px; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ag .time { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: auto; }
  .ag .task { font-size: 15px; font-weight: 650; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ag .task a { color: inherit; }
  .ag .task a:hover { color: var(--accent); }
  .now { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 13px; min-height: 52px; }
  .now .said { color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now .doing { color: var(--muted); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now .doing .k { color: var(--soft); }
  .facts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .f { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
  .f.ok { color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, var(--line)); }
  .f.warn { color: var(--auto); border-color: color-mix(in srgb, var(--auto) 45%, var(--line)); }
  .report-btn.interim { border-color: var(--auto); color: var(--auto); }
  .f.think { background: none; cursor: pointer; color: var(--soft); }
  .f.think:hover { border-color: var(--accent); color: var(--text); }
  .menu .levels { display: flex; flex-direction: column; }
  .menu.think-menu { min-width: 0; width: min(620px, calc(100vw - 16px)); }
  .menu.think-menu button.tk-opt { display: inline-flex; width: auto; padding: 5px 9px; border: 1px solid #2a323d; background: #161b21; border-radius: 8px; color: #b7bfcb; }
  .menu.think-menu button.tk-opt.on { border-color: var(--tk, var(--m)); background: color-mix(in srgb, var(--tk, var(--m)) 18%, #161b21); color: #e8ebf0; }
  .ag .head .tk-badge { margin-left: 4px; }
  .menu .levels button.on { background: color-mix(in srgb, var(--accent) 20%, transparent); font-weight: 600; }
  .f.live { color: var(--active); border-color: color-mix(in srgb, var(--active) 45%, var(--line)); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .more { margin-left: auto; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--muted); padding: 2px 9px; cursor: pointer; font-size: 17px; line-height: 1; }
  .more:hover { border-color: var(--line2); color: var(--text); }
  .note { font-size: 12px; color: var(--muted); }
  .note.bad { color: var(--bad); } .note.good { color: var(--done); }
  .folded summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; gap: 6px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px; }
  .folded summary::-webkit-details-marker { display: none; }
  .folded .grid { margin-top: 10px; }
  .folded .ag { opacity: .8; }

  /* Accepting in series */
  .train { border: 1px solid color-mix(in srgb, var(--auto) 60%, var(--line)); border-radius: var(--r); padding: 12px 14px; background: color-mix(in srgb, var(--auto) 6%, var(--panel)); }
  .train.over { border-color: var(--line2); background: var(--panel); }
  .train .th { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .train .bar { height: 5px; border-radius: 3px; background: var(--panel3); margin: 10px 0; overflow: hidden; }
  .train .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--done), var(--auto)); transition: width .4s; }
  .train .blocked { border: 1px solid var(--auto); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; color: var(--auto); font-size: 13px; }
  .train .blocked small { color: var(--muted); }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .steps .step { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 8px; }
  .steps .step.now { background: color-mix(in srgb, var(--active) 10%, transparent); }
  .steps .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1.5px solid var(--line2); color: var(--muted); }
  .steps .t-accepted .dot { background: var(--done); border-color: var(--done); color: #08130d; }
  .steps .t-failed .dot { background: var(--bad); border-color: var(--bad); color: #200; }
  .steps .t-accepting .dot, .steps .t-fixing .dot { border-color: var(--active); color: var(--active); animation: pulse 1.4s infinite; --c: var(--active); }
  .steps .body { min-width: 0; font-size: 13px; }
  .steps .body small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .steps .body small.msg { white-space: normal; color: var(--soft); }
  .steps .t-failed small.msg { color: var(--bad); }
  .steps .st { font-size: 12px; color: var(--soft); margin-left: 6px; }
  .steps .t-skipped { opacity: .55; }
  dialog.series { width: min(760px, 96vw); max-height: 90vh; padding: 0; background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 14px; }
  dialog.series::backdrop { background: rgba(0, 0, 0, .55); }
  .sd { display: flex; flex-direction: column; max-height: 90vh; }
  .sd .sh { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
  .sd .sh h3 { margin: 0; font-size: 17px; flex: 1; }
  .sd > p { margin: 0; padding: 0 16px 10px; }
  .pick-list { list-style: none; margin: 0; padding: 4px 16px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .pick-list li { display: grid; grid-template-columns: 20px 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .pick-list li.off { opacity: .5; }
  .pick-list .chk input { accent-color: var(--done); width: 16px; height: 16px; margin: 0; }
  .pick-list .num { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--done); display: grid; place-items: center; font-size: 12px; color: var(--done); }
  .pick-list .body { min-width: 0; font-size: 13px; }
  .pick-list .body .muted { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-list .facts { margin-top: 4px; }
  .pick-list .moves { display: flex; gap: 4px; }
  .sd .sf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); margin-top: 8px; }
  .linklike { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; }
  /* Drawer: everything about one agent */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 40; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -24px 0 50px rgba(0, 0, 0, .45); transform: translateX(105%); transition: transform .2s; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer .dh { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .drawer .db { padding: 12px 16px 40px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  .drawer h3 { margin: 0; font-size: 17px; line-height: 1.3; }
  .drawer h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--soft); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .timeline li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; }
  .timeline li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--soft); }
  .timeline li.say .t { color: var(--text); white-space: normal; }
  .timeline li.error .t { color: var(--bad); }
  .timeline li .w { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .commits { list-style: none; margin: 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
  .commits li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; }
  .commits .sha { font-family: ui-monospace, monospace; color: var(--muted); }
  .commits .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer textarea { width: 100%; min-height: 90px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  .drawer select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .think-box { margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
  .report .md { font-size: 13px; color: var(--soft); margin-top: 6px; }
  .report .md h5 { margin: 12px 0 4px; font-size: 13px; color: var(--text); }
  .report .md p { margin: 5px 0; } .report .md ul { margin: 4px 0; padding-left: 18px; }
  .report .md blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--auto); background: color-mix(in srgb, var(--auto) 8%, transparent); color: var(--text); border-radius: 4px; }
  .report .md table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; }
  .report .md td { border: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
  .report .md code { background: var(--panel2); padding: 0 4px; border-radius: 4px; font-size: 12px; }
  .drawer pre { white-space: pre-wrap; word-break: break-word; font-size: 11.5px; background: var(--panel); border-radius: 8px; padding: 8px; max-height: 260px; overflow: auto; margin: 6px 0 0; }
  .drawer details summary { cursor: pointer; color: var(--soft); font-size: 13px; }
  .shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 35; display: none; }
  .shade.on { display: block; }

  .menu { position: fixed; z-index: 60; background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 4px; min-width: 240px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  .menu button, .menu a { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-radius: 6px; padding: 7px 10px; cursor: pointer; color: var(--text); }
  .menu button:hover, .menu a:hover { background: var(--panel3); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .hint { font-size: 11.5px; color: var(--muted); padding: 2px 10px 6px; }

  .toast { position: fixed; right: 16px; bottom: 16px; z-index: 70; background: var(--panel3); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 14px; max-width: 460px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
  .toast.bad { border-color: var(--bad); }

  @media (max-width: 700px) {
    nav.site { display: none; }
    .bar1, .bar2 { padding-left: 16px; padding-right: 16px; }
    .bar2 { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
    .bar2::-webkit-scrollbar { display: none; }
    .wrap { padding: 12px 16px 120px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="top">
  <div class="bar1">
    <h1>Agents</h1>
    <nav class="site"><a href="/">Accueil</a><a href="/agents" class="on">Agents</a><a href="/journal">Journal</a><a href="/versions">Versions</a><a href="/roadmap">Backlog</a><a href="/questions">Questions</a><a href="/notifications" title="Notifications">🔔</a></nav>
    <span class="spacer"></span>
    <a class="old" href="/agents/v1" title="L'ancienne page, avec ses onglets de versions">ancienne page</a>
  </div>
  <div class="bar2" id="chips"></div>
</div>

<div class="wrap">
  <section id="train-sec"></section>
  <section><h2 class="sec">Ce qui t'attend <span class="n" id="inbox-n"></span></h2><div class="inbox" id="inbox"></div></section>
  <section><h2 class="sec" id="list-title">Agents</h2><div class="grid" id="grid"></div><div id="folded"></div></section>
</div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Détail de l'agent"></aside>
<dialog class="series" id="series"></dialog>

<script src="/think.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
const ago = (ms) => {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  return s < 60 ? 'à l’instant' : s < 3600 ? `il y a ${Math.round(s / 60)} min` : s < 86400 ? `il y a ${(s / 3600).toFixed(1).replace('.0', '')} h` : `il y a ${Math.round(s / 86400)} j`;
};
const ms = (iso) => (typeof iso === 'number' ? iso : Date.parse(iso ?? '') || 0);

const STATUS = {
  review: { label: 'fini · à accepter', order: 0 },
  error: { label: 'en erreur', order: 1 },
  working: { label: 'au travail', order: 2 },
  queued: { label: 'en file', order: 3 },
  idle: { label: 'en pause', order: 4 },
  merged: { label: 'acceptée', order: 5 },
};
let agents = [];
let queue = [];
let questions = { pending: 0, byAgent: {}, settings: {} };
let train = null;
let mainRoot = '';
// /agents?f=review (the « À valider » stage of the navigation) opens on that filter.
const FILTERS = ['live', 'review', 'working', 'error', 'idle', 'merged'];
let filter = FILTERS.includes(new URLSearchParams(location.search).get('f')) ? new URLSearchParams(location.search).get('f') : store.get('agents.filter', 'live');
let opened = null;
const notes = new Map(); // name -> { text, bad }

// ---------------------------------------------------------------- what an agent is doing, in words
const TOOLS = { Read: 'lit', Write: 'écrit', Edit: 'modifie', MultiEdit: 'modifie', Bash: 'lance', Grep: 'cherche', Glob: 'cherche', WebFetch: 'consulte', WebSearch: 'cherche sur le web', Task: 'délègue', TodoWrite: 'note ses étapes', Agent: 'délègue' };
function human(event) {
  if (!event) return '';
  const [tool, ...rest] = String(event.text).split(' · ');
  const what = rest.join(' · ');
  if (event.kind !== 'tool' || !rest.length) return { k: '', t: String(event.text).split('\n')[0] };
  const file = /^\/|^[\w.-]+\//.test(what) ? what.split(/\s/)[0].split('/').pop() : what;
  return { k: TOOLS[tool] ?? tool, t: file };
}
function statusOf(agent) {
  const name = agent.AGENT_NAME;
  const entry = queue.find((one) => one.name === name);
  const run = agent.run ?? entry?.run;
  const events = agent.progress?.events ?? [];
  const recent = agent.activity && Date.now() - agent.activity < 10 * 60_000;
  if (entry?.status === 'queued') return 'queued';
  if (agent.AGENT_ARCHIVED) return 'merged';
  if (run?.state === 'running') return 'working';
  if (run?.state === 'error' || run?.state === 'lost') return 'error';
  if (events.at(-1)?.kind === 'error' && /API Error/.test(events.at(-1).text)) return 'error';
  if (run?.state === 'done' || agent.progress?.finished || (agent.report && !agent.reportInterim && !agent.dirty?.length && !recent)) return 'review';
  return recent ? 'working' : 'idle';
}
function view(agent) {
  const status = statusOf(agent);
  const events = agent.progress?.events ?? [];
  const lastSay = [...events].reverse().find((e) => e.kind === 'say');
  const lastTool = [...events].reverse().find((e) => e.kind === 'tool');
  const lastError = events.at(-1)?.kind === 'error' ? events.at(-1) : null;
  const run = agent.run ?? queue.find((one) => one.name === agent.AGENT_NAME)?.run;
  const d = agent.deliverables ?? {};
  return {
    agent, name: agent.AGENT_NAME, status,
    title: agent.goal?.title ?? agent.AGENT_NAME,
    taskId: queue.find((one) => one.name === agent.AGENT_NAME)?.id ?? null,
    where: agent.goal?.where ?? '',
    said: lastSay?.text?.split('\n')[0] ?? '',
    doing: human(lastTool),
    doingAt: lastTool?.time ?? lastSay?.time ?? agent.activity,
    error: status === 'error' ? (run?.state === 'lost' ? 'Son processus a disparu.' : lastError?.text?.split('\n')[0] ?? (run?.code != null ? `Arrêté avec le code ${run.code}.` : 'Interrompu.')) : '',
    since: run?.startedAt ? ms(run.startedAt) : null,
    d, commits: agent.commits ?? [],
    dirty: agent.dirty ?? [],
    serving: Boolean(agent.server && agent.client),
    asks: questions.byAgent?.[agent.AGENT_NAME]?.pending ?? 0,
    run,
    behind: d.behind > 0,
    refused: notes.get(agent.AGENT_NAME),
  };
}

// ---------------------------------------------------------------- data
async function load() {
  const [a, q, qs] = await Promise.all([
    fetch('/api/agents', { cache: 'no-store' }).then((r) => r.json()),
    fetch('/api/queue', { cache: 'no-store' }).then((r) => r.json()).catch(() => []),
    fetch('/api/questions?status=pending', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ pending: 0, byAgent: {}, settings: {} })),
  ]);
  agents = (a.agents ?? []).filter((one) => one.AGENT_KIND !== 'release');
  train = a.mergeTrain;
  mainRoot = a.main;
  queue = q;
  questions = qs;
  render();
}

// ---------------------------------------------------------------- pieces
const thinkLabel = (effort) => (effort ? `${effort} · ${PROJECT.effortLabels?.[effort] ?? ''}` : '');
function facts(v, full = false) {
  const d = v.d;
  const out = [];
  out.push(`<span class="f${v.commits.length ? ' ok' : ''}">${v.commits.length} commit${v.commits.length > 1 ? 's' : ''}</span>`);
  if (v.status !== 'queued') {
    out.push(v.agent.reportInterim ? `<button class="f warn think" data-report="${esc(v.name)}" title="Son rapport intermédiaire : le lire">🚧 rapport en cours</button>` : `<span class="f${d.report ? ' ok' : ''}">${d.report ? '✓' : '○'} rapport</span>`);
    out.push(`<span class="f${d.entry ? ' ok' : ''}">${d.entry ? '✓' : '○'} entrée</span>`);
    if (d.captures || full) out.push(`<span class="f${d.captures ? ' ok' : ''}">${d.captures ?? 0} capture${d.captures > 1 ? 's' : ''}</span>`);
  }
  if (d.behind > 0) out.push(`<span class="f warn" title="Des commits de ${esc(d.base)} à fusionner dans sa branche">${d.behind} en retard</span>`);
  if (v.dirty.length && v.status !== 'working') out.push(`<span class="f warn">${v.dirty.length} fichier${v.dirty.length > 1 ? 's' : ''} non commité${v.dirty.length > 1 ? 's' : ''}</span>`);
  if (v.serving) out.push(`<span class="f live">● jeu sur :${esc(v.agent.CLIENT_PORT)}</span>`);
  if (v.asks) out.push(`<span class="f" style="color:var(--ask);border-color:var(--ask)">❓ ${v.asks} question${v.asks > 1 ? 's' : ''}</span>`);
  return out.join('');
}
// The one or two things to do with an agent now, as buttons.
function mainActions(v) {
  const n = esc(v.name);
  if (inTrain(v.name)) return `<a class="btn small" href="/run/${n}" target="_blank">Sortie</a>`;
  const tryBtn = v.serving ? `<a class="btn small" href="http://localhost:${esc(v.agent.CLIENT_PORT)}" target="_blank">↗ Ouvrir sa version</a>` : `<button class="btn small" data-do="try" data-name="${n}">▶ Tester</button>`;
  if (v.asks) return `<a class="btn small primary" href="/questions">❓ Répondre</a>`;
  if (v.status === 'review') {
    if (v.refused) return `<button class="btn small warn" data-do="fix-accept" data-name="${n}">🛠 Faire corriger</button>${tryBtn}`;
    if (v.behind) return `${tryBtn}<button class="btn small ok" data-do="accept" data-name="${n}">✓ Accepter</button><button class="btn small warn" data-do="fix-conflicts" data-name="${n}" title="Fusionner sa base dans sa branche et régler les conflits">🔀 Mettre à jour</button>`;
    return `${tryBtn}<button class="btn small ok" data-do="accept" data-name="${n}">✓ Accepter</button>`;
  }
  if (v.status === 'error') return `<button class="btn small primary" data-do="resume" data-name="${n}">↻ Relancer</button><a class="btn small" href="/run/${n}" target="_blank">Sortie</a>`;
  if (v.status === 'working') return `<a class="btn small" href="/run/${n}" target="_blank">Sortie</a>${v.run?.state === 'running' ? `<button class="btn small danger" data-do="kill" data-name="${n}" title="Arrêter l'agent">■ Arrêter</button>` : ''}`;
  if (v.status === 'queued') return `<button class="btn small primary" data-do="launch" data-name="${n}">▶ Lancer</button>`;
  if (v.status === 'idle') return `<button class="btn small" data-do="order" data-name="${n}">✎ Nouvel ordre</button>${v.run ? `<button class="btn small" data-do="resume" data-name="${n}">↻ Relancer</button>` : ''}`;
  return `<a class="btn small" href="/journal?agent=${n}" target="_blank">Commits et rapport</a>`;
}
function nowBox(v) {
  if (v.status === 'error') return `<div class="now"><div class="said" style="color:var(--bad)">${esc(v.error)}</div>${v.said ? `<div class="doing">dernier mot : ${esc(v.said)}</div>` : ''}</div>`;
  if (v.status === 'queued') return '<div class="now"><div class="doing">En file : il partira au lancement.</div></div>';
  const said = v.said || (v.status === 'review' ? 'Rapport remis.' : 'Il démarre…');
  const doing = v.status === 'working' && v.doing?.t ? `<div class="doing"><span class="k">${esc(v.doing.k)}</span> ${esc(v.doing.t)} · ${ago(v.doingAt)}</div>` : '';
  return `<div class="now"><div class="said">${v.status === 'review' ? '✋ ' : '💬 '}${esc(said)}</div>${doing}</div>`;
}
function card(v) {
  const n = esc(v.name);
  return `<article class="ag s-${v.status}${opened === v.name ? ' sel' : ''}" data-open="${n}">
    <div class="head"><span class="status">${STATUS[v.status].label}</span><span class="name">${n}</span><span class="time">${v.since ? ago(v.since) : ''}</span>${Think.badge(v.agent.settings ?? {}, { as: 'button', attrs: `data-think="${n}"`, small: true, fallback: PROJECT.defaults.effort, title: `Réflexion et modèle de ${v.name}, pour son prochain lancement : cliquer pour changer` })}</div>
    <div class="task">${v.taskId ? `<a href="/roadmap#t-${esc(v.taskId)}" title="Le chantier dans le backlog">${esc(v.title)}</a>` : esc(v.title)}</div>
    ${nowBox(v)}
    <div class="facts">${facts(v)}</div>
    <div class="acts">${mainActions(v)}${v.agent.report ? `<button class="btn small report-btn${v.agent.reportInterim ? ' interim' : ''}" data-report="${n}" title="${v.agent.reportInterim ? 'Son rapport intermédiaire : où il en est' : 'Son rapport'}">${v.agent.reportInterim ? '🚧' : '📝'} Rapport</button>` : ''}${inTrain(v.name) ? `<span class="f live">${esc(inTrain(v.name))}</span>` : ''}<button class="more" data-menu="${n}" aria-label="Plus d'actions">⋯</button></div>
    ${notes.get(v.name) ? `<div class="note ${notes.get(v.name).bad ? 'bad' : 'good'}">${esc(notes.get(v.name).text)}</div>` : ''}
  </article>`;
}

// ---------------------------------------------------------------- render
function render() {
  const views = agents.map(view).sort((a, b) => STATUS[a.status].order - STATUS[b.status].order || (b.agent.activity ?? 0) - (a.agent.activity ?? 0));
  const by = (status) => views.filter((v) => v.status === status);
  const live = views.filter((v) => v.status !== 'merged');
  // Chips: filters with their counts, the questions, deciding alone, the actions of the whole team.
  const chip = (key, label, n, color) => `<button class="chip${filter === key ? ' on' : ''}${n ? '' : ' zero'}" data-f="${key}" style="--c:${color}">${label} <b>${n}</b></button>`;
  $('chips').innerHTML = [
    chip('live', 'Actifs', live.length, 'var(--accent)'),
    chip('review', 'À accepter', by('review').length, 'var(--auto)'),
    chip('working', 'Au travail', by('working').length, 'var(--active)'),
    chip('error', 'En erreur', by('error').length, 'var(--bad)'),
    chip('idle', 'En pause', by('idle').length + by('queued').length, 'var(--muted)'),
    chip('merged', 'Acceptées', by('merged').length, 'var(--done)'),
    `<a class="chip${questions.pending ? '' : ' zero'}" href="/questions" style="--c:var(--ask)">Questions <b>${questions.pending}</b></a>`,
    '<span class="spacer"></span>',
    `<label class="switch" title="Activé : les agents prennent l'option recommandée sans attendre. Désactivé : ils te posent leurs choix structurants et attendent ta réponse."><input type="checkbox" id="alone" ${questions.settings?.autonomous ? 'checked' : ''}>Décider seuls</label>`,
    '<button class="btn small" data-team-menu>Équipe ⋯</button>',
  ].join('');

  // The series under way, or just over: one step per task.
  $('train-sec').innerHTML = trainPanel(views);

  // Inbox: what needs you, most urgent first.
  const inbox = [];
  for (const v of views) {
    // A task in the series is followed there: no second « Accepter » here.
    if (inTrain(v.name)) continue;
    const n = esc(v.name);
    const title = esc(v.title);
    if (v.asks) inbox.push({ c: 'var(--ask)', html: `<span class="what">❓ <b>${n}</b> te pose ${v.asks > 1 ? `${v.asks} questions` : 'une question'}<small>${title}</small></span><a class="btn small primary" href="/questions">Répondre</a>` });
    else if (v.status === 'error') inbox.push({ c: 'var(--bad)', html: `<span class="what">⚠ <b>${n}</b> s'est arrêté<small>${esc(v.error)} · ${title}</small></span>${mainActions(v)}` });
    else if (v.status === 'review') inbox.push({ c: 'var(--auto)', html: `<span class="what">✋ <b>${n}</b> a fini « ${title} »<small>${esc(v.said || 'rapport remis')}</small></span>${mainActions(v)}` });
  }
  $('inbox-n').innerHTML = `${inbox.length ? `(${inbox.length})` : ''}${acceptable(views).length > 1 && !trainRunning() ? ` <button class="btn small ok" data-series style="margin-left:8px;text-transform:none;letter-spacing:0">✓ Tout accepter… (${acceptable(views).length})</button>` : ''}`;
  $('inbox').innerHTML = inbox.map((one) => `<div class="todo-line" style="--c:${one.c}">${one.html}</div>`).join('') || '<div class="calm">Rien ne t’attend : les agents travaillent ou sont au repos.</div>';

  // Grid
  const shown = filter === 'live' ? live : filter === 'idle' ? [...by('queued'), ...by('idle')] : by(filter);
  $('list-title').innerHTML = `${{ live: 'Agents actifs', review: 'À accepter', working: 'Au travail', error: 'En erreur', idle: 'En pause et en file', merged: 'Acceptées' }[filter]} <span class="n">${shown.length}</span>`;
  $('grid').innerHTML = shown.map(card).join('') || '<div class="calm">Aucun agent ici.</div>';
  const merged = by('merged');
  $('folded').innerHTML = filter === 'live' && merged.length ? `<details class="folded"${store.get('agents.folded', false) ? ' open' : ''} style="margin-top:14px"><summary>✓ ${merged.length} acceptée${merged.length > 1 ? 's' : ''}, en attente de publication ou de nettoyage ▸</summary><div class="grid">${merged.map(card).join('')}</div></details>` : '';
  if (opened) renderDrawer();
}

// ---------------------------------------------------------------- accepting in series
// The finished agents « Accepter » would take: over, with commits, no question pending, not refused, not in a series.
const acceptable = (views) => views.filter((v) => v.status === 'review' && v.commits.length && !v.asks && !v.refused && !inTrain(v.name));
const trainRunning = () => Boolean(train?.items?.length && !train.finishedAt);
const TRAIN_STATE = {
  waiting: { icon: '○', label: 'en attente' },
  accepting: { icon: '⟳', label: 'fusion…' },
  fixing: { icon: '🔀', label: 'règle un conflit' },
  accepted: { icon: '✓', label: 'acceptée' },
  failed: { icon: '✕', label: 'échec' },
  skipped: { icon: '–', label: 'sautée' },
};
function inTrain(name) {
  const item = trainRunning() && train.items.find((one) => one.name === name && !['accepted', 'failed', 'skipped'].includes(one.state));
  return item ? `en série · ${TRAIN_STATE[item.state]?.label ?? item.state}` : '';
}
function trainPanel(views) {
  if (!train?.items?.length) return '';
  const items = train.items;
  const over = Boolean(train.finishedAt);
  const count = (state) => items.filter((it) => it.state === state).length;
  const done = items.filter((it) => ['accepted', 'failed', 'skipped'].includes(it.state)).length;
  const title = (name) => views.find((v) => v.name === name)?.title ?? '';
  const more = acceptable(views);
  const head = over
    ? `<b>Acceptation en série finie</b> <span class="note">${count('accepted')} acceptée${count('accepted') > 1 ? 's' : ''}${count('failed') ? ` · <span style="color:var(--bad)">${count('failed')} en échec</span>` : ''}${count('skipped') ? ` · ${count('skipped')} sautée${count('skipped') > 1 ? 's' : ''}` : ''}</span>`
    : `<b>Acceptation en série</b> <span class="note">${done} sur ${items.length}</span>`;
  const rows = items.map((it, index) => {
    const st = TRAIN_STATE[it.state] ?? { icon: '?', label: it.state };
    const current = !over && !['accepted', 'failed', 'skipped', 'waiting'].includes(it.state);
    const detail = it.state === 'fixing' ? `l'agent fusionne ${esc(views.find((v) => v.name === it.name)?.d?.base ?? 'sa base')} et règle le conflit (essai ${it.fixes} sur 2), puis la fusion reprend`
      : it.state === 'accepting' ? 'fusion dans le dépôt principal…'
      : it.message && it.state !== 'accepted' ? esc(it.message) : it.state === 'accepted' ? esc(it.message || 'fusionnée') : '';
    const action = it.state === 'fixing' ? `<button class="btn small" data-do="open" data-name="${esc(it.name)}">Voir ce qu'il fait</button>`
      : it.state === 'failed' ? `<button class="btn small" data-do="open" data-name="${esc(it.name)}">Ouvrir l'agent</button>` : '';
    return `<li class="step t-${esc(it.state)}${current ? ' now' : ''}"><span class="dot">${index + 1}</span><span class="body"><b class="mono">${esc(it.name)}</b> <span class="st">${st.icon} ${st.label}</span><small>${esc(title(it.name))}</small>${detail ? `<small class="msg">${detail}</small>` : ''}</span>${action}</li>`;
  }).join('');
  const blocked = train.blocked && !over ? `<div class="blocked">⏸ En attente du dépôt principal : ${esc(train.blocked)}<br><small>Règle ça, la file reprend toute seule.</small></div>` : '';
  const controls = over
    ? `<button class="btn small" data-train="clear">✕ Fermer</button>`
    : `${more.length ? `<button class="btn small" data-series-add>+ Ajouter les finies (${more.length})</button>` : ''}<button class="btn small danger" data-train="stop" title="Les tâches pas encore traitées sont sautées ; celle en cours finit">■ Arrêter après celle en cours</button>`;
  return `<div class="train${over ? ' over' : ''}"><div class="th">${head}<span class="spacer"></span>${controls}</div>
    <div class="bar"><i style="width:${Math.round((done / items.length) * 100)}%"></i></div>${blocked}<ol class="steps">${rows}</ol></div>`;
}

// The dialog before a series: which ones, in which order, and what may conflict.
let series = { names: [], include: new Set(), preview: {}, suggested: [], loading: false, add: false };
async function openSeries(add = false) {
  const views = agents.map(view);
  const names = acceptable(views).map((v) => v.name);
  series = { names, include: new Set(names), preview: {}, suggested: names, loading: true, add };
  renderSeries();
  $('series').showModal();
  const result = await (await fetch(`/api/merge-train/preview?names=${names.join(',')}`, { cache: 'no-store' })).json();
  series.preview = result.preview ?? {};
  series.suggested = result.order ?? names;
  series.names = [...series.suggested];
  series.loading = false;
  renderSeries();
}
function risk(name) {
  const p = series.preview[name];
  if (!p) return series.loading ? '<span class="note">analyse…</span>' : '';
  const others = Object.entries(p.withOthers ?? {}).filter(([other]) => series.include.has(other));
  const before = others.filter(([other]) => series.names.indexOf(other) < series.names.indexOf(name));
  const out = [];
  if (p.withBase.length) out.push(`<span class="f warn" title="${esc(p.withBase.join('\n'))}">⚠ ${p.withBase.length} fichier${p.withBase.length > 1 ? 's' : ''} aussi changé${p.withBase.length > 1 ? 's' : ''} sur ${esc(p.base)}</span>`);
  for (const [other, files] of before) out.push(`<span class="f warn" title="${esc(files.join('\n'))}">⚠ après ${esc(other)} : ${files.map((file) => esc(file.split('/').pop())).join(', ')}</span>`);
  if (!out.length) out.push('<span class="f ok">✓ rien en commun : sans conflit attendu</span>');
  if (p.behind) out.push(`<span class="f">${p.behind} commit${p.behind > 1 ? 's' : ''} de ${esc(p.base)} à rattraper</span>`);
  return out.join('');
}
function renderSeries() {
  const views = agents.map(view);
  const chosen = series.names.filter((name) => series.include.has(name));
  const conflicts = chosen.filter((name) => (series.preview[name]?.withBase.length) || Object.keys(series.preview[name]?.withOthers ?? {}).some((other) => series.include.has(other) && chosen.indexOf(other) < chosen.indexOf(name))).length;
  const suggested = series.suggested.filter((name) => series.include.has(name)).join() === chosen.join();
  $('series').innerHTML = `<form method="dialog" class="sd">
    <div class="sh"><h3>${series.add ? 'Ajouter à la série' : 'Tout accepter, l’une après l’autre'}</h3><button class="btn small" value="cancel">✕</button></div>
    <p class="note">Chaque branche est fusionnée dans sa base, dans le dépôt principal, <b>dans cet ordre</b>. Si une fusion bute sur un conflit, l'agent concerné fusionne sa base dans sa branche et le règle lui-même (2 essais au plus), puis la série reprend. Une tâche qui échoue est laissée de côté et la série continue.</p>
    <ol class="pick-list">${series.names.map((name, index) => {
      const v = views.find((one) => one.name === name);
      return `<li class="${series.include.has(name) ? '' : 'off'}"><label class="chk"><input type="checkbox" data-s-include="${esc(name)}" ${series.include.has(name) ? 'checked' : ''}></label>
        <span class="num">${series.include.has(name) ? chosen.indexOf(name) + 1 : '–'}</span>
        <span class="body"><b class="mono">${esc(name)}</b> <span class="muted">${esc(v?.title ?? '')}</span><span class="facts">${series.include.has(name) ? risk(name) : '<span class="note">pas dans cette série</span>'}</span></span>
        <span class="moves"><button type="button" class="btn small" data-s-move="${esc(name)}" data-dir="-1" ${index ? '' : 'disabled'} aria-label="Plus tôt">↑</button><button type="button" class="btn small" data-s-move="${esc(name)}" data-dir="1" ${index < series.names.length - 1 ? '' : 'disabled'} aria-label="Plus tard">↓</button></span></li>`;
    }).join('')}</ol>
    <div class="sf"><span class="note">${series.loading ? 'Analyse des fichiers en commun…' : conflicts ? `${conflicts} pourrait demander une correction par son agent.` : 'Aucun conflit attendu.'}${!series.loading && !suggested ? ' <button type="button" class="linklike" data-s-suggest>Revenir à l’ordre conseillé</button>' : !series.loading && chosen.length > 1 ? ' Ordre conseillé : les moins risquées d’abord.' : ''}</span>
      <span class="spacer"></span><button class="btn" value="cancel">Annuler</button><button type="button" class="btn ok" data-s-go ${chosen.length ? '' : 'disabled'}>✓ ${series.add ? 'Ajouter' : 'Accepter'} les ${chosen.length}, dans cet ordre</button></div></form>`;
}
document.addEventListener('click', async (event) => {
  if (event.target.closest('[data-series]')) return openSeries(false);
  if (event.target.closest('[data-series-add]')) return openSeries(true);
  const move = event.target.closest('[data-s-move]');
  if (move) {
    const i = series.names.indexOf(move.dataset.sMove);
    const j = i + Number(move.dataset.dir);
    [series.names[i], series.names[j]] = [series.names[j], series.names[i]];
    return renderSeries();
  }
  if (event.target.closest('[data-s-suggest]')) return (series.names = [...series.suggested], renderSeries());
  if (event.target.closest('[data-s-go]')) {
    const names = series.names.filter((name) => series.include.has(name));
    const result = await call('/api/merge-train', { names });
    $('series').close();
    toast(result.ok ? `Série lancée : ${names.length} à accepter, dans l'ordre.` : result.error, !result.ok);
    return load();
  }
});
document.addEventListener('change', (event) => {
  const box = event.target.closest('[data-s-include]');
  if (!box) return;
  box.checked ? series.include.add(box.dataset.sInclude) : series.include.delete(box.dataset.sInclude);
  renderSeries();
});

// A report in Markdown, simply: titles, lists, tables, quotes, bold, code, images of its folder.
let reportOpen = null;
function md(text) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<i class="muted">[image : $1]</i>').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
  let html = '', list = false, table = false;
  for (const line of String(text).split('\n')) {
    if (/^\s*\|/.test(line)) {
      if (/^\s*\|[\s:-]+\|/.test(line) && !/[a-z]/i.test(line)) continue;
      if (!table) (html += '<table>', table = true);
      html += `<tr>${line.trim().replace(/^\||\|$/g, '').split('|').map((cell) => `<td>${inline(cell.trim())}</td>`).join('')}</tr>`;
      continue;
    }
    if (table) (html += '</table>', table = false);
    if (/^\s*[-*]\s+/.test(line)) { if (!list) (html += '<ul>', list = true); html += `<li>${inline(line.replace(/^\s*[-*]\s+/, ''))}</li>`; continue; }
    if (list) (html += '</ul>', list = false);
    const head = /^(#{1,4})\s+(.*)$/.exec(line);
    if (head) html += `<h5>${inline(head[2])}</h5>`;
    else if (/^>\s*/.test(line)) html += `<blockquote>${inline(line.replace(/^>\s*/, ''))}</blockquote>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? '</ul>' : '') + (table ? '</table>' : '');
}

// ---------------------------------------------------------------- drawer
let progress = { name: null, events: [] };
let messages = { name: null, list: [] };
async function openDrawer(name) {
  opened = name;
  drawerKey = '';
  $('drawer').classList.add('open');
  $('shade').classList.add('on');
  render();
  const [p, m] = await Promise.all([fetch(`/api/progress/${encodeURIComponent(name)}`, { cache: 'no-store' }).then((r) => r.json()), fetch(`/api/team/messages?agent=${encodeURIComponent(name)}`, { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ messages: [] }))]);
  progress = { name, events: p.events ?? [] };
  messages = { name, list: m.messages ?? [] };
  drawerKey = '';
  renderDrawer();
}
function closeDrawer() {
  opened = null;
  $('drawer').classList.remove('open');
  $('shade').classList.remove('on');
  render();
}
let drawerKey = '';
function renderDrawer() {
  const agent = agents.find((one) => one.AGENT_NAME === opened);
  if (!agent) return closeDrawer();
  const v = view(agent);
  const n = esc(v.name);
  const events = progress.name === v.name ? progress.events : agent.progress?.events ?? [];
  const key = JSON.stringify([agent, events.length, notes.get(v.name), questions.byAgent?.[v.name]]);
  if (key === drawerKey && $('drawer').innerHTML) return;
  // Keep a typed order through the refreshes.
  const typed = $('order-text')?.value ?? '';
  drawerKey = key;
  const settings = agent.settings ?? {};
  const opt = (values, current, label) => [`<option value="">${label}</option>`, ...values.map((value) => `<option ${value === current ? 'selected' : ''}>${esc(value)}</option>`)].join('');
  $('drawer').innerHTML = `<div class="dh s-${v.status}">
      <div style="display:flex;gap:8px;align-items:center"><span class="status">${STATUS[v.status].label}</span><span class="name mono muted">${n}</span><span class="spacer"></span><button class="btn small" data-close>✕ Fermer</button></div>
      <h3>${esc(v.title)}</h3>
      <div class="note">${esc(v.where)}${v.taskId ? ` · <a href="/roadmap#t-${esc(v.taskId)}">dans le backlog</a>` : ''} · branche <code>${esc(agent.AGENT_BRANCH)}</code>${v.since ? ` · lancé ${ago(v.since)}` : ''}</div>
      <div class="acts" style="margin-top:4px">${mainActions(v)}</div>
    </div>
    <div class="db">
      ${nowBox(v)}
      <div class="facts">${facts(v, true)}</div>
      <div class="box"><h4>Lui parler</h4>
        <textarea id="order-text" placeholder="Un nouvel ordre : ce qu'il doit peaufiner ou faire en plus (il reprend son chantier là où il l'a laissé)">${esc(typed)}</textarea>
        <div class="acts" style="margin-top:6px"><button class="btn small primary" data-do="order-send" data-name="${n}" ${v.run?.state === 'running' ? 'disabled title="Il travaille : attends qu\'il ait fini, ou arrête-le"' : ''}>Envoyer l'ordre</button></div>
        <div class="think-box">${Think.picker(v.name, settings)}<div class="note">Valent pour son prochain lancement : ordre, relance, correction de conflit.</div></div></div>
      <div class="box"><h4>Ce qu'il a fait <span class="muted" style="text-transform:none;letter-spacing:0">(${events.length})</span></h4>
        <ul class="timeline">${[...events].reverse().slice(0, 40).map((e) => { const h = human(e); return `<li class="${e.kind}"><span>${e.kind === 'say' ? '💬' : e.kind === 'error' ? '⚠' : '⚙'}</span><span class="t" title="${esc(e.text)}">${h.k ? `<span class="muted">${esc(h.k)}</span> ` : ''}${esc(h.t)}</span><span class="w">${ago(e.time)}</span></li>`; }).join('') || '<li class="muted">Rien encore.</li>'}</ul></div>
      <div class="box"><h4>Ses commits <span class="muted" style="text-transform:none;letter-spacing:0">${esc(agent.diffstat ?? '')}</span></h4>
        <ul class="commits">${v.commits.map((c) => `<li><span class="sha">${esc(c.sha)}</span><span class="s" title="${esc(c.subject)}">${esc(c.subject)}</span><span class="w muted" style="font-size:11.5px">${ago(c.time)}</span></li>`).join('') || '<li class="muted">Aucun commit.</li>'}</ul>
        <div class="acts" style="margin-top:8px"><a class="btn small" href="/journal?agent=${n}" target="_blank">Commits et rapport</a><a class="btn small" href="/run/${n}" target="_blank">Sortie complète</a></div></div>
      ${messages.name === v.name && messages.list.length ? `<div class="box"><h4>Messages avec les autres agents (${messages.list.length})</h4><ul class="timeline">${messages.list.slice(-20).reverse().map((one) => `<li class="say"><span>${one.from === v.name ? '↗' : '↘'}</span><span class="t"><b class="mono">${esc(one.from)}</b> → ${esc(one.to)}${one.about ? ` <span class="muted">(${esc(one.about)})</span>` : ''} : ${esc(one.text)}${one.from !== v.name && !one.readBy?.includes(v.name) && one.to !== 'tous' ? ' <span class="f warn">pas encore lu</span>' : ''}</span><span class="w">${ago(Date.parse(one.at))}</span></li>`).join('')}</ul></div>` : ''}
      ${agent.report ? `<details class="box report" ${agent.reportInterim || reportOpen === v.name ? 'open' : ''}><summary><h4 style="display:inline">${agent.reportInterim ? '🚧 Son rapport intermédiaire' : 'Son rapport'}</h4></summary><div class="md">${md(agent.report)}</div></details>` : ''}
      ${v.dirty.length ? `<div class="box"><h4>Fichiers non commités (${v.dirty.length})</h4><pre>${esc(v.dirty.join('\n'))}</pre></div>` : ''}
      <div class="box"><h4>Son jeu</h4>
        <div class="acts">${v.serving ? `<a class="btn small" href="http://localhost:${esc(agent.CLIENT_PORT)}" target="_blank">↗ Ouvrir (:${esc(agent.CLIENT_PORT)})</a><button class="btn small" data-do="down" data-name="${n}">■ Arrêter son jeu</button>` : `<button class="btn small" data-do="try" data-name="${n}">▶ Lancer son jeu</button>`}<span class="note">serveur :${esc(agent.SERVER_PORT)} · client :${esc(agent.CLIENT_PORT)}</span></div>
        <details style="margin-top:8px"><summary>Journal du serveur</summary><pre>${esc(agent.serverLog ?? '')}</pre></details>
        <details><summary>Journal du client</summary><pre>${esc(agent.clientLog ?? '')}</pre></details></div>
      ${agent.goal?.text ? `<details class="box"><summary>Son chantier, en entier</summary><pre>${esc(agent.goal.text)}</pre></details>` : ''}
    </div>`;
}

// ---------------------------------------------------------------- actions
let toastTimer = 0;
function toast(text, bad = false) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = `toast${bad ? ' bad' : ''}`;
  el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), bad ? 10000 : 4500);
}
async function call(url, body) {
  const response = await fetch(url, { method: 'POST', body: body === undefined ? undefined : JSON.stringify(body) });
  try {
    return await response.json();
  } catch {
    return { ok: response.ok };
  }
}
const CONFIRM = {
  accept: (n) => `Accepter « ${n} » ? Sa branche est fusionnée dans sa base, dans le dépôt principal, et la tâche passe dans « À publier ».`,
  kill: (n) => `Arrêter l'agent « ${n} » ? (son processus et tout son groupe)`,
  rebase: (n) => `Rebaser « ${n} » sur ${store.get('agents.base', 'master')} ?`,
};
async function act(what, name) {
  if (CONFIRM[what] && !confirm(CONFIRM[what](name))) return;
  const busy = { accept: 'Fusion…', try: 'Lancement de son jeu…', 'fix-conflicts': 'Ordre envoyé…', 'fix-accept': 'Ordre envoyé…', resume: 'Relance…', kill: 'Arrêt…', launch: 'Lancement…', down: 'Arrêt de son jeu…', rebase: 'Rebase…', unarchive: '…' }[what];
  if (busy) toast(`${name} : ${busy}`);
  let result;
  if (what === 'accept') result = await call(`/api/accept/${name}`);
  if (what === 'fix-conflicts') result = await call(`/api/fix-conflicts/${name}`);
  if (what === 'fix-accept') result = await call(`/api/fix-accept/${name}`);
  if (what === 'resume') result = await call(`/api/queue/${name}/resume`, {});
  if (what === 'kill') result = await call(`/api/queue/${name}/stop`);
  if (what === 'launch') result = await call(`/api/queue/${name}/launch`);
  if (what === 'down') result = await call(`/api/down/${name}`);
  if (what === 'unarchive') result = await call(`/api/unarchive/${name}`);
  if (what === 'rebase') {
    const agent = agents.find((one) => one.AGENT_NAME === name);
    result = await call(`/api/rebase/${name}?base=${encodeURIComponent(store.get('agents.base', 'master'))}${statusOf(agent) === 'review' ? '&archive=1' : ''}`);
  }
  if (what === 'try') {
    result = await call(`/api/up/${name}`);
    if (result.ok) window.open(result.url, '_blank');
  }
  if (what === 'order' ) return openDrawer(name).then(() => $('order-text')?.focus());
  if (what === 'order-send') {
    const order = $('order-text')?.value.trim();
    if (!order) return toast('Écris d’abord l’ordre.', true);
    result = await call(`/api/order/${name}`, { order });
    if (result.ok) $('order-text').value = '';
  }
  if (!result) return;
  notes.set(name, { text: result.ok ? result.message ?? 'fait' : result.error, bad: !result.ok });
  if (what === 'accept' && !result.ok && result.fixable === false) notes.delete(name);
  if (result.ok) setTimeout(() => (notes.delete(name), render()), 9000);
  toast(result.ok ? `${name} : ${result.message ?? 'fait'}` : `${name} : ${result.error}`, !result.ok);
  await load();
}
// The team's actions (were the header's buttons).
async function teamAction(what) {
  if (what === 'refresh-backlog') return (location.href = '/roadmap?refresh=1');
  if (what === 'push' || what === 'clean') {
    const plan = await call(`/api/${what}?dry=1`);
    if (!plan.ok) return toast(plan.error, true);
    const text = what === 'push'
      ? `Pousser sur GitHub (${plan.remote}) ?\n\n${(plan.refs ?? []).map((one) => `• ${one.label} : ${one.action}`).join('\n') || '(rien à pousser)'}`
      : `Nettoyer ces agents finis (worktree, branche, sorties) ?\n\n${[...(plan.cleaned ?? []), ...(plan.orphans ?? []).map((b) => `branche ${b}`)].map((one) => `• ${one}`).join('\n') || '(rien à nettoyer)'}`;
    if (what === 'clean' && !(plan.cleaned?.length || plan.orphans?.length)) return toast('Rien à nettoyer.');
    if (!confirm(text)) return;
    const result = await call(`/api/${what}`);
    toast(result.ok ? (what === 'push' ? 'Poussé sur GitHub.' : `Nettoyés : ${(result.cleaned ?? []).join(', ') || 'rien'}`) : result.error ?? (result.errors ?? []).join(' · '), !result.ok);
    return load();
  }
  if (what === 'rebase-done') {
    const done = agents.filter((agent) => statusOf(agent) === 'review');
    if (!done.length) return toast('Aucune tâche finie à rebaser.');
    if (!confirm(`Rebaser sur ${store.get('agents.base', 'master')} et archiver : ${done.map((a) => a.AGENT_NAME).join(', ')} ?`)) return;
    for (const agent of done) await call(`/api/rebase/${agent.AGENT_NAME}?base=${encodeURIComponent(store.get('agents.base', 'master'))}&archive=1`);
    return load();
  }
}

// ---------------------------------------------------------------- menus
let menu = null;
function closeMenu() { menu?.remove(); menu = null; }
function place(el, button) {
  document.body.appendChild(el);
  const rect = button.getBoundingClientRect();
  el.style.left = `${Math.max(8, Math.min(rect.right - el.offsetWidth, innerWidth - el.offsetWidth - 8))}px`;
  el.style.top = `${Math.min(rect.bottom + 4, innerHeight - el.offsetHeight - 8)}px`;
}
function agentMenu(button, name) {
  closeMenu();
  const agent = agents.find((one) => one.AGENT_NAME === name);
  const v = view(agent);
  menu = document.createElement('div');
  menu.className = 'menu';
  menu.innerHTML = `
    <button data-do="open" data-name="${esc(name)}">👁 Tout voir</button>
    <a href="/run/${esc(name)}" target="_blank">📜 Sortie de claude</a>
    <a href="/journal?agent=${esc(name)}" target="_blank">📝 Commits et rapport</a>
    <hr>
    ${v.serving ? `<a href="http://localhost:${esc(agent.CLIENT_PORT)}" target="_blank">↗ Ouvrir sa version</a><button data-do="down" data-name="${esc(name)}">■ Arrêter son jeu</button>` : `<button data-do="try" data-name="${esc(name)}">▶ Tester sa version</button>`}
    ${v.run?.state !== 'running' ? `<button data-do="order" data-name="${esc(name)}">✎ Nouvel ordre</button>` : ''}
    ${v.run && v.run.state !== 'running' ? `<button data-do="resume" data-name="${esc(name)}">↻ Relancer (même session)</button>` : ''}
    ${v.run?.state === 'running' ? `<button data-do="kill" data-name="${esc(name)}">■ Arrêter l'agent</button>` : ''}
    <hr>
    ${v.status === 'review' ? `<button data-do="accept" data-name="${esc(name)}">✓ Accepter</button>` : ''}
    ${v.status !== 'working' && v.status !== 'merged' ? `<button data-do="fix-conflicts" data-name="${esc(name)}">🔀 Mettre à jour avec sa base (conflits)</button>` : ''}
    <button data-do="rebase" data-name="${esc(name)}">⟳ Rebaser sur ${esc(store.get('agents.base', 'master'))}</button>
    ${agent.AGENT_ARCHIVED ? `<button data-do="unarchive" data-name="${esc(name)}">↩ Remettre en cours</button>` : ''}`;
  place(menu, button);
}
// The badge of a card: how much the agent thinks (claude --effort) and its model, for its next start.
async function saveThink(name, field, value) {
  const agent = agents.find((one) => one.AGENT_NAME === name);
  const body = { effort: agent?.settings?.effort ?? null, model: agent?.settings?.model ?? null, [field]: value };
  const result = await call(`/api/settings/${name}`, body);
  const running = agent && view(agent).run?.state === 'running';
  toast(result.ok ? `${name} : ${Think.word(body.effort, 'réflexion par défaut')}${body.model ? ` · ${body.model}` : ''}${running ? ', pour sa prochaine relance.' : ', pour son prochain lancement.'}` : result.error, !result.ok);
  if (agent && result.ok) agent.settings = { ...agent.settings, ...body };
  drawerKey = '';
  render();
}
function thinkMenu(button, name) {
  closeMenu();
  const agent = agents.find((one) => one.AGENT_NAME === name);
  const running = view(agent).run?.state === 'running';
  menu = document.createElement('div');
  menu.className = 'menu think-menu';
  menu.innerHTML = `<div class="hint"><b>${esc(name)}</b>${running ? ' · il travaille : vaudra pour sa prochaine relance ou son prochain ordre' : ' · pour son prochain lancement'}</div><div style="padding:6px 8px 8px">${Think.picker(name, agent?.settings ?? {})}</div>`;
  place(menu, button);
  Think.onPick(menu, (key, field, value) => saveThink(key, field, value));
}
function teamMenu(button) {
  closeMenu();
  menu = document.createElement('div');
  menu.className = 'menu';
  const base = store.get('agents.base', 'master');
  menu.innerHTML = `
    <button data-team="refresh-backlog">⟳ Rafraîchir le backlog</button>
    <button data-team="rebase-done">⟳ Rebaser les finies (et les archiver)</button>
    <div class="hint">sur <select id="rebase-base" style="background:var(--bg);border:1px solid var(--line);border-radius:6px">${['master', 'backlog'].map((one) => `<option ${one === base ? 'selected' : ''}>${one}</option>`).join('')}</select></div>
    <hr>
    <button data-team="push">⇪ Pousser sur GitHub…</button>
    <button data-team="clean">🧹 Nettoyer les finies…</button>
    <hr>
    <a href="/versions">📦 Versions, À publier, Branches →</a>
    <a href="/agents/v1">L'ancienne page</a>`;
  place(menu, button);
  menu.querySelector('#rebase-base').addEventListener('change', (event) => store.set('agents.base', event.target.value));
}

// ---------------------------------------------------------------- events
document.addEventListener('click', async (event) => {
  const inMenu = event.target.closest('.menu');
  if (menu && !inMenu) closeMenu();
  const team = event.target.closest('[data-team]');
  if (team) return (closeMenu(), teamAction(team.dataset.team));
  if (event.target.closest('[data-team-menu]')) return (event.stopPropagation(), teamMenu(event.target.closest('[data-team-menu]')));
  const report = event.target.closest('[data-report]');
  if (report) return (event.stopPropagation(), openReport(report.dataset.report));
  const think = event.target.closest('[data-think]');
  if (think) return (event.stopPropagation(), thinkMenu(think, think.dataset.think));
  const more = event.target.closest('[data-menu]');
  if (more) return (event.stopPropagation(), agentMenu(more, more.dataset.menu));
  const doIt = event.target.closest('[data-do]');
  if (doIt) {
    closeMenu();
    if (doIt.dataset.do === 'open') return openDrawer(doIt.dataset.name);
    return act(doIt.dataset.do, doIt.dataset.name);
  }
  const f = event.target.closest('[data-f]');
  if (f) {
    filter = f.dataset.f;
    store.set('agents.filter', filter);
    history.replaceState(null, '', filter === 'review' ? '/agents?f=review' : '/agents');
    window.dispatchEvent(new Event('wf:route'));
    return render();
  }
  const t = event.target.closest('[data-train]');
  if (t) {
    if (t.dataset.train === 'stop' && !confirm('Arrêter la file ? Les tâches pas encore traitées sont sautées.')) return;
    await call(`/api/merge-train/${t.dataset.train}`, {});
    return load();
  }
  if (event.target.closest('[data-close]') || event.target.id === 'shade') return closeDrawer();
  if (event.target.closest('a, button, input, select, label, textarea, summary')) return;
  const open = event.target.closest('[data-open]');
  if (open) openDrawer(open.dataset.open);
});
document.addEventListener('change', async (event) => {
  if (event.target.id === 'alone') {
    await call('/api/questions/settings', { autonomous: event.target.checked });
    toast(event.target.checked ? 'Les agents décident seuls (option recommandée).' : 'Les agents te posent leurs choix et attendent ta réponse.');
    return load();
  }
  const setting = event.target.closest('[data-setting]');
  if (setting) {
    const name = setting.dataset.name;
    const body = Object.fromEntries([...document.querySelectorAll(`[data-setting][data-name="${CSS.escape(name)}"]`)].map((s) => [s.dataset.setting, s.value || null]));
    const result = await call(`/api/settings/${name}`, body);
    toast(result.ok ? 'Enregistré : vaut pour son prochain lancement.' : result.error, !result.ok);
  }
});
document.addEventListener('toggle', (event) => { if (event.target.classList?.contains('folded')) store.set('agents.folded', event.target.open); }, true);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') (menu ? closeMenu() : opened && closeDrawer()); });

Think.onPick($('drawer'), (key, field, value) => saveThink(key, field, value));

// An agent's report, from its card or from the Backlog (/agents#<name>:rapport): its drawer, open on the report.
async function openReport(name) {
  reportOpen = name;
  await openDrawer(name);
  document.querySelector('.drawer .report')?.scrollIntoView({ block: 'start' });
}

// /agents#<name> opens that agent, /agents#<name>:rapport its report.
load().then(() => {
  const [hash, part] = decodeURIComponent(location.hash.slice(1)).split(':');
  if (hash && agents.some((a) => a.AGENT_NAME === hash)) (part === 'rapport' ? openReport(hash) : openDrawer(hash));
});
setInterval(() => { if (!menu && document.visibilityState === 'visible') load(); }, 4000);
</script>
<script src="/nav.js"></script>
