<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DOC__ · __PROJECT__</title>
<style>
  :root { --bg: #111418; --panel: #1a1f26; --panel2: #222933; --line: #2e3744; --text: #e6e9ee; --muted: #8b95a5; --accent: #7aa7ff; --bad: #ef6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--bg); z-index: 2; flex-wrap: wrap; }
  header b { font-size: 16px; }
  nav.site { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.site a { color: var(--muted); padding: 3px 10px; border-radius: 99px; font-size: 13px; }
  nav.site a:hover { color: var(--text); background: var(--panel2); text-decoration: none; }
  .spacer { flex: 1; }
  .path { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; }
  aside { position: sticky; top: 64px; align-self: start; font-size: 13px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
  aside a { display: block; padding: 3px 8px; border-radius: 6px; color: #c9d1dc; }
  aside a.on, aside a:hover { background: var(--panel2); color: var(--text); text-decoration: none; }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 28px 24px; min-width: 0; }
  .md h1 { font-size: 24px; margin: 18px 0 8px; }
  .md h2 { font-size: 18px; margin: 24px 0 6px; color: var(--accent); }
  .md h3 { font-size: 15px; margin: 16px 0 4px; }
  .md p, .md li { color: #d5dae2; }
  .md ul { padding-left: 20px; margin: 4px 0; }
  .md code { background: var(--panel2); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .md pre { background: var(--panel2); padding: 10px; border-radius: 6px; overflow: auto; font-size: 12.5px; }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel2); }
  .md img { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); margin: 6px 0; }
  .bad { color: var(--bad); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 12px 16px 30px; }
    aside { position: static; }
    header { padding: 10px 16px; }
    article { padding: 4px 16px 18px; }
  }
</style>
</head>
<body>
<header>
  <b>📄 Document</b>
  <nav class="site"><a href="/">Accueil</a><a href="/agents">Agents</a><a href="/journal">Journal</a><a href="/versions">Versions</a><a href="/roadmap">Backlog</a><a href="/questions">Questions</a></nav>
  <span class="spacer"></span>
  <span class="path">__DOC__</span>
  <a href="/doc/__DOC__?raw=1">source</a>
</header>
<div class="layout">
  <aside>
    <h2>Documents</h2>
  </aside>
  <article class="md" id="doc">chargement…</article>
</div>
<script src="/markdown.js"></script>
<script>
// The documents of the project (docs of agents.config.mjs, or the defaults of config.mjs).
const escapeHtml = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
document.querySelector('aside').insertAdjacentHTML('beforeend', PROJECT.docs.map((doc) => `<a href="/doc/${escapeHtml(doc.path)}">${doc.icon ?? ''} ${escapeHtml(doc.label)}</a>`).join(''));
// The document is read raw from /doc/<path>?raw=1 and rendered by the dashboard's Markdown renderer; its relative
// links and images resolve next to it, and links to other documents stay in this tab.
const path = '__DOC__';
const base = `/doc/${path.replace(/[^/]*$/, '')}`;
for (const link of document.querySelectorAll('aside a')) if (link.getAttribute('href') === `/doc/${path}`) link.classList.add('on');
fetch(`/doc/${encodeURI(path)}?raw=1`, { cache: 'no-store' })
  .then((response) => (response.ok ? response.text() : Promise.reject(new Error(`${response.status}`))))
  .then((text) => {
    const article = document.getElementById('doc');
    article.innerHTML = window.renderMarkdown ? window.renderMarkdown(text, base) : `<pre>${text.replace(/[&<]/g, (c) => (c === '&' ? '&amp;' : '&lt;'))}</pre>`;
    for (const link of article.querySelectorAll('a[href^="/doc/"]')) if (!link.querySelector('img')) link.removeAttribute('target');
    const title = /^#\s+(.+)$/m.exec(text);
    if (title) document.title = `${title[1]} · ${PROJECT.name}`;
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  })
  .catch((error) => (document.getElementById('doc').innerHTML = `<p class="bad">Document illisible (${error.message}).</p>`));
</script>
</body>
</html>
